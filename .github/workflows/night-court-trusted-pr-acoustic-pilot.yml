name: Night Court trusted PR acoustic pilot
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'Night Court/research/trigger-s01e01-audio-pilot.txt'
permissions:
  contents: read
concurrency:
  group: night-court-trusted-s01e01-pilot
  cancel-in-progress: false
jobs:
  trusted-pilot:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-s01e01-audio-pilot-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout only trusted base revision, never PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check exactly pinned source candidate and offline safety
        run: |
          python 'Night Court/tools/test_pilot_ftp_video_acoustics.py'
          python 'Night Court/tools/test_ftp_video_metadata.py'
      - name: Install required media utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Process one approved S01E01 excerpt using trusted base code
        run: |
          python 'Night Court/tools/pilot_ftp_video_acoustics.py' \
            --protocol ftp \
            --start-seconds 60 \
            --duration-seconds 15 \
            --output "${{ runner.temp }}/s01e01-acoustic-report.json"
      - name: Upload compact evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-trusted-s01e01-acoustic-evidence
          path: ${{ runner.temp }}/s01e01-acoustic-report.json
          retention-days: 7
          if-no-files-found: error
