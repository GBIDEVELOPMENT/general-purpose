name: Night Court Qwen original AVI one-clip owner pilot

on:
  pull_request:
    paths:
      - 'Night Court/tools/owner_qwen_original_video_pilot.py'
      - 'Night Court/tools/test_owner_qwen_original_video_pilot.py'
      - 'Night Court/tools/test_owner_qwen_workflow_trust.py'
      - '.github/workflows/night-court-owner-qwen-picture-pilot.yml'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-owner-qwen-original-video.txt'
      - 'Night Court/research/trigger-owner-qwen-physical-comedy.txt'
      - 'Night Court/research/trigger-owner-qwen-compact-action.txt'
      - 'Night Court/research/trigger-owner-qwen-compact-twofps.txt'

permissions:
  contents: read

concurrency:
  # Privileged media replays are serialized; cheap unprivileged PR tests are
  # independently schedulable and can cancel obsolete branch revisions.
  group: night-court-owner-qwen-${{ github.event_name == 'pull_request_target' && 'trusted-source' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-original-source-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate owner allowlist, bounded clip selection and synthetic cut scan without credentials
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180 sudo apt-get update -qq
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python3 'Night Court/tools/test_owner_qwen_original_video_pilot.py' -v
          python3 'Night Court/tools/test_owner_qwen_workflow_trust.py' -v

  announce-trusted-owner-run-locator:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'GBIDEVELOPMENT/general-purpose' &&
      (github.event.pull_request.head.ref == 'research/night-court-qwen-real-original-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-physical-comedy-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-compact-action-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-compact-twofps-trigger') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # This non-media job gets PR-comment rights only. It does not access FTP
    # credentials, check out source, or share a process with the model jobs.
    permissions:
      pull-requests: write
    steps:
      - name: Record exact trusted workflow run ID on the owner trigger PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="Trusted Night Court owner-source Qwen visual micro-pilot workflow locator: $RUN_URL. This comment identifies a run, not its completion or any audiovisual/script acceptance. Original media remains private and transient."
  trusted-owner-source-visual-inference:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'GBIDEVELOPMENT/general-purpose' &&
      (github.event.pull_request.head.ref == 'research/night-court-qwen-real-original-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-physical-comedy-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-compact-action-trigger' ||
       github.event.pull_request.head.ref == 'research/night-court-qwen-compact-twofps-trigger') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        episode: [S01E01, S09E19]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/night-court-original-qwen-model-cache
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout trusted reviewed base only, never PR-head source code
        uses: actions/checkout@v4
        with:
          # pull_request_target github.sha is the reviewed current base-branch commit
          # for THIS trigger, rather than a stale base SHA held by the PR.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable original source allowlist before secret-scoped operation
        run: |
          python 'Night Court/tools/test_owner_qwen_original_video_pilot.py' -v
      - name: Install pinned local CPU Qwen inference runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180 sudo apt-get update -qq
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m venv /tmp/night-court-qwen-env
          timeout 360 /tmp/night-court-qwen-env/bin/pip install --disable-pip-version-check -q \
            'torch==2.7.1' 'torchvision==0.22.1' --index-url https://download.pytorch.org/whl/cpu
          timeout 180 /tmp/night-court-qwen-env/bin/pip install --disable-pip-version-check -q \
            'transformers==4.57.1' 'accelerate>=1.0,<2' 'decord==0.6.0' 'pillow>=10,<13' 'num2words==0.5.14' 'av==15.0.0'
      - name: Read one exact owner-original AVI and write compact UNREVIEWED Qwen text evidence
        env:
          FTP_HOST: wood.seedhost.eu
          FTP_USER: ianseeds
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          timeout 720 /tmp/night-court-qwen-env/bin/python -u \
            'Night Court/tools/owner_qwen_original_video_pilot.py' \
            --owner-confirm-original-source \
            --episode '${{ matrix.episode }}' \
            --focus '${{ (github.event.pull_request.head.ref == 'research/night-court-qwen-physical-comedy-trigger' || github.event.pull_request.head.ref == 'research/night-court-qwen-compact-action-trigger' || github.event.pull_request.head.ref == 'research/night-court-qwen-compact-twofps-trigger') && 'physical_comedy' || 'observational' }}' \
            --prompt-profile '${{ (github.event.pull_request.head.ref == 'research/night-court-qwen-compact-action-trigger' || github.event.pull_request.head.ref == 'research/night-court-qwen-compact-twofps-trigger') && 'action_compact' || 'standard' }}' \
            --video-fps '${{ github.event.pull_request.head.ref == 'research/night-court-qwen-compact-twofps-trigger' && '2' || '1' }}' \
            --output '${{ runner.temp }}/nc-qwen-original-${{ matrix.episode }}.json'
      - name: Convert original-source model inference into deferred editor questions and safe metrics
        # No original movie/audio/credential is needed by these small tools.
        # Every decision remains deferred and independently unaccepted.
        run: |
          set -euo pipefail
          python3 'Night Court/tools/prepare_video_stage_review.py' \
            --model-report '${{ runner.temp }}/nc-qwen-original-${{ matrix.episode }}.json' \
            --decisions '${{ runner.temp }}/nc-qwen-pending-${{ matrix.episode }}.json' \
            --review-packet '${{ runner.temp }}/nc-qwen-review-${{ matrix.episode }}.md' \
            --reviewer-id original-film-pending
          python3 'Night Court/tools/summarize_original_qwen_pilot_metrics.py' \
            --report '${{ runner.temp }}/nc-qwen-original-${{ matrix.episode }}.json' \
            --output '${{ runner.temp }}/nc-qwen-safe-metrics-${{ matrix.episode }}.json'
      - name: Retain only small original-source-SHA-linked model proposals for private review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-owner-original-qwen-proposals-${{ matrix.episode }}
          path: |
            ${{ runner.temp }}/nc-qwen-original-${{ matrix.episode }}.json
            ${{ runner.temp }}/nc-qwen-pending-${{ matrix.episode }}.json
            ${{ runner.temp }}/nc-qwen-review-${{ matrix.episode }}.md
            ${{ runner.temp }}/nc-qwen-safe-metrics-${{ matrix.episode }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy model weights cache, derived report and temporary environment
        if: always()
        run: |
          rm -rf /tmp/night-court-qwen-env /tmp/night-court-original-qwen-model-cache
          rm -f '${{ runner.temp }}/nc-qwen-original-${{ matrix.episode }}.json' '${{ runner.temp }}/nc-qwen-pending-${{ matrix.episode }}.json' '${{ runner.temp }}/nc-qwen-review-${{ matrix.episode }}.md' '${{ runner.temp }}/nc-qwen-safe-metrics-${{ matrix.episode }}.json'
