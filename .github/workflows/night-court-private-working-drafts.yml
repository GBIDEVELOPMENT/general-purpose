name: Night Court private two-pilot integrated editorial screenplay delivery

on:
  pull_request:
    paths:
      - '.github/workflows/night-court-private-working-drafts.yml'
      - 'Night Court/research/**'
      - '!Night Court/research/trigger-original-pilot-audio-evidence.txt'
      - 'Night Court/tools/**'
      # The modern one-click factory owns its own validation and private
      # output. It must not regenerate the historical v6→v16 pilot pipeline.
      - '!Night Court/tools/script_factory.py'
      - '!Night Court/tools/test_script_factory.py'
      - '!Night Court/tools/preserve_original_qwen_model_reports.py'
      - '!Night Court/tools/test_preserve_original_qwen_model_reports.py'
      - '!Night Court/tools/owner_qwen_original_video_pilot.py'
      - '!Night Court/tools/test_owner_qwen_original_video_pilot.py'
      - '!Night Court/tools/source_once_canonical_voice.py'
      - '!Night Court/tools/test_source_once_canonical_voice.py'
      - '!Night Court/tools/preflight_original_media_transport.py'
      - '!Night Court/tools/test_preflight_original_media_transport.py'
      # The one-pass AV editor changes decisions, not the canonical caption source.
      # Its own lightweight workflow validates these files independently.
      - '!Night Court/tools/episode_finish.py'
      - '!Night Court/tools/test_episode_finish.py'
      - '!Night Court/tools/test_episode_finish_workbench.js'
      - '!Night Court/tools/publish_current_original_av.py'
      - '!Night Court/tools/test_publish_current_original_av.py'
      - '!Night Court/tools/search_fan_retrieval_chunks.py'
      - '!Night Court/tools/test_search_fan_retrieval_chunks.py'
      # Only changes to the TWO canonical source-pilot episode trees
      # can require rebuilding both 1984/1992 editorial manuscripts.
      # Other 191 episodes are owned by the separate script factory.
      - 'Night Court/seasons/S01/S01E01/**'
      - 'Night Court/seasons/S09/S09E19/**'
      - 'Night Court/saved-private/editorial-agent1-v*/**'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/night-court-private-working-drafts.yml'
      - 'Night Court/research/**'
      - '!Night Court/research/trigger-original-pilot-audio-evidence.txt'
      - 'Night Court/tools/**'
      # The modern one-click factory owns its own validation and private
      # output. It must not regenerate the historical v6→v16 pilot pipeline.
      - '!Night Court/tools/script_factory.py'
      - '!Night Court/tools/test_script_factory.py'
      - '!Night Court/tools/preserve_original_qwen_model_reports.py'
      - '!Night Court/tools/test_preserve_original_qwen_model_reports.py'
      - '!Night Court/tools/owner_qwen_original_video_pilot.py'
      - '!Night Court/tools/test_owner_qwen_original_video_pilot.py'
      - '!Night Court/tools/source_once_canonical_voice.py'
      - '!Night Court/tools/test_source_once_canonical_voice.py'
      - '!Night Court/tools/preflight_original_media_transport.py'
      - '!Night Court/tools/test_preflight_original_media_transport.py'
      # The one-pass AV editor changes decisions, not the canonical caption source.
      # Its own lightweight workflow validates these files independently.
      - '!Night Court/tools/episode_finish.py'
      - '!Night Court/tools/test_episode_finish.py'
      - '!Night Court/tools/test_episode_finish_workbench.js'
      - '!Night Court/tools/publish_current_original_av.py'
      - '!Night Court/tools/test_publish_current_original_av.py'
      - '!Night Court/tools/search_fan_retrieval_chunks.py'
      - '!Night Court/tools/test_search_fan_retrieval_chunks.py'
      # Only changes to the TWO canonical source-pilot episode trees
      # can require rebuilding both 1984/1992 editorial manuscripts.
      # Other 191 episodes are owned by the separate script factory.
      - 'Night Court/seasons/S01/S01E01/**'
      - 'Night Court/seasons/S09/S09E19/**'
      - 'Night Court/saved-private/editorial-agent1-v*/**'

concurrency:
  group: night-court-private-pilots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-private-pilot-reading-scripts:
    if: >-
      github.repository == 'GBIDEVELOPMENT/general-purpose' &&
      github.event.repository.private == true &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exactly source-pinned provisional roles and both pilot scripts
        run: |
          set -euo pipefail
          PYTHONPATH='Night Court/tools' python -m unittest -v test_upgrade_latest_editorial_pilots
          T="${RUNNER_TEMP}/night-court-pilot-v15"
          python 'Night Court/tools/build_external_speaker_reader_v6.py' --output "$T/v6"
          python 'Night Court/tools/build_contextual_speaker_reader_v7.py' --v6 "$T/v6" --output "$T/v7"
          python 'Night Court/tools/build_original_audio_speaker_reader_v8.py' --v7 "$T/v7" --output "$T/v8"
          python 'Night Court/tools/build_s09_source_acoustic_speaker_reader_v9.py' --current-v8 "$T/v8" --output "$T/v9"
          python 'Night Court/tools/build_s09_source_turns_v10.py' --v9 "$T/v9" --output "$T/v10"
          python 'Night Court/tools/build_s09_mixed_voice_turns_v11.py' --v10 "$T/v10" --output "$T/v11"
          python 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py' --v11 "$T/v11" --output "$T/v12"
          python 'Night Court/tools/build_s09_explicit_handoff_turns_v13.py' --v12 "$T/v12" --output "$T/v13"
          python 'Night Court/tools/apply_source_role_amendments.py' --v13 "$T/v13" --output "$T/roles"
          python 'Night Court/tools/apply_source_turn_amendments.py' --source-role-patches "$T/roles" --output "$T/turns"
          python 'Night Court/tools/apply_s01_c219_source_turn.py' --source-turn-patches "$T/turns" --output "$T/v15"
          python 'Night Court/tools/apply_manual_context_pilot_review_v16.py' \
            --v15-root "$T/v15" --output "$T/deliverable"
          python 'Night Court/tools/upgrade_latest_editorial_pilots.py' \
            --working-root "$T/deliverable"
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --working-pilot-root "$T/deliverable" --output "$T/deliverable/private-fan-retrieval"
      - name: Validate private manuscripts, coverage, review queue, and complete fan corpus
        run: |
          python 'Night Court/tools/validate_private_pilot_snapshot.py' \
            --snapshot "${RUNNER_TEMP}/night-court-pilot-v15/deliverable"
      - name: Upload short-lived artifact accessible through the PRIVATE repository
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: night-court-original-pilot-working-screenplays-private
          path: ${{ runner.temp }}/night-court-pilot-v15/deliverable/
          retention-days: 7
          if-no-files-found: error
      - name: Erase private source-derived and output text
        if: always()
        run: rm -rf "${RUNNER_TEMP}/night-court-pilot-v15"

  persist-private-editorial-snapshot:
    needs: generate-private-pilot-reading-scripts
    if: >-
      github.event_name != 'pull_request' &&
      needs.generate-private-pilot-reading-scripts.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: night-court-original-pilot-working-screenplays-private
          path: ${{ runner.temp }}/night-court-current-private-snapshot
      - name: Refuse stale workflow run before replacing committed manuscripts
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # Checkout reflects the *generation* revision, not whichever commit
          # happens to be main by the time publication finishes.
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
            echo "::error::Publisher checked out a different revision from generator"; exit 1;
          }
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || {
            echo "::error::Main advanced during generation. Refusing stale snapshot overwrite."; exit 1;
          }
      - name: Validate and persist exact private working output
        env:
          SNAPSHOT: ${{ runner.temp }}/night-court-current-private-snapshot
        run: |
          set -euo pipefail
          python 'Night Court/tools/validate_private_pilot_snapshot.py' --snapshot "$SNAPSHOT"
          mkdir -p 'Night Court/saved-private/pilot-current'
          rsync -a --delete "$SNAPSHOT/" 'Night Court/saved-private/pilot-current/'
          git add -- 'Night Court/saved-private/pilot-current'
          if git diff --cached --quiet; then
            echo 'Current validated private snapshot already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Night Court: persist validated current private pilot screenplays and fan corpus'
            # Non-fast-forward push is rejected: never clobber a newer editor.
            git push origin HEAD:main
          fi
      - name: Queue one-pass original-AV review only after publisher succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=night-court-canonical-published

  announce-private-draft-download:
    needs: [generate-private-pilot-reading-scripts, persist-private-editorial-snapshot]
    if: >-
      github.event_name != 'pull_request' &&
      needs.persist-private-editorial-snapshot.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Record exact successful private artifact run on the pilot issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/issues/441/comments" \
            -f body="Generated and SHA-checked the two PRIVATE 1984 Night Court pilot dialogue WORKING drafts. Plus the private 193-episode fan-retrieval seed (191 source-only episodes). Download the seven-day artifact 'night-court-original-pilot-working-screenplays-private' from [this successful Actions run]($RUN_URL) under Artifacts. A validated private snapshot with manuscripts, provenance and current retrieval was committed to main under Night Court/saved-private/pilot-current/. NO speaker identities, stage claims or full episodes were independently AV-certified by this run."
