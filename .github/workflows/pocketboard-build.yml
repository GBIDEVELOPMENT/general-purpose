name: PocketBoard build

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketBoard/**'
      - '.github/workflows/pocketboard-build.yml'
  pull_request:
    paths:
      - 'PocketBoard/**'
      - '.github/workflows/pocketboard-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish tray receiver
        run: dotnet publish PocketBoard/windows/PocketBoard.Windows.csproj -c Release -r win-x64 -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoard-Windows-x64
          path: |
            dist/windows/PocketBoard.Windows.exe
            PocketBoard/windows/install.ps1
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate adaptive launcher vectors
        run: python3 PocketBoard/android/verify_launcher_assets.py
      - name: Build APK
        working-directory: PocketBoard/android
        run: gradle :app:packagePocketBoardDebugApk --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoard-Android-debug
          path: PocketBoard/android/app/build/dist/PocketBoard-*.apk
          if-no-files-found: error


