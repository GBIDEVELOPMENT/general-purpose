name: Night Court source-verified in-scene physical stage directions QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/render_in_scene_stage_directions_v6.py'
      - 'Night Court/tools/test_render_in_scene_stage_directions_v6.py'
      - 'Night Court/seasons/S01/S01E01/derived/caption-first-source-stage-in-scene-v6/**'
      - 'Night Court/seasons/S09/S09E19/derived/caption-first-source-stage-in-scene-v6/**'
      - '.github/workflows/night-court-original-stage-in-scene-qa.yml'
      - '.github/workflows/night-court-trusted-stage-in-scene-delivery.yml'
permissions:
  contents: read
jobs:
  original-source-structure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert all source text intact, timed video evidence adjacent, untimed episode never fabricated
        run: |
          python 'Night Court/tools/test_render_in_scene_stage_directions_v6.py'
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S01E01 --output-root "${{ runner.temp }}/scripts"
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S09E19 --output-root "${{ runner.temp }}/scripts"
          if test -f 'Night Court/seasons/S01/S01E01/derived/caption-first-source-stage-in-scene-v6/screenplay-with-stage-directions.md'; then
            python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S01E01 --check
          fi
          if test -f 'Night Court/seasons/S09/S09E19/derived/caption-first-source-stage-in-scene-v6/screenplay-with-stage-directions.md'; then
            python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S09E19 --check
          fi
