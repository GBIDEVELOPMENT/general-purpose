name: Night Court trusted S09 credited original character screenplay continuity
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-s09-credited-continuity.txt'
permissions:
  contents: write
jobs:
  publish-source-dialogue-script:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-s09-credited-continuity-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - run: |
          python 'Night Court/tools/test_build_s09_cast_continuity_reader_v3.py'
          python 'Night Court/tools/build_s09_cast_continuity_reader_v3.py'
          python 'Night Court/tools/build_s09_cast_continuity_reader_v3.py' --check
      - name: Save original-untimed scene and dialog revisions as isolated review PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-s09-credited-continuity-v3-20261024'
          git add -- 'Night Court/seasons/S09/S09E19/derived/cast-continuity-reading-screenplay-v3'
          git diff --cached --check
          git commit -m 'Night Court: improve 53 original credited S09 dialogue roles while preserving untimed source'
          git push origin HEAD:refs/heads/data/night-court-s09-credited-continuity-v3-20261024
