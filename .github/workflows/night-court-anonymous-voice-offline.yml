name: Night Court safe anonymous vocal similarity offline checks
on:
  pull_request:
    paths:
      - 'Night Court/tools/s01e01_anonymous_voice_similarity.py'
      - 'Night Court/tools/test_s01e01_anonymous_voice_similarity.py'
      - '.github/workflows/night-court-anonymous-voice-offline.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only NumPy for model-free synthetic cosine checks
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Refuse source drift and fabricate no speaker identities
        run: |
          python -m py_compile "Night Court/tools/s01e01_anonymous_voice_similarity.py"
          python "Night Court/tools/test_s01e01_anonymous_voice_similarity.py"
