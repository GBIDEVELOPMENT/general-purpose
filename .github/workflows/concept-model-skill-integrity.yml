name: Concept model skill integrity

on:
  pull_request:
    paths:
      - 'skills/concept-model-engineering/**'
      - '.github/workflows/concept-model-skill-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'skills/concept-model-engineering/**'
      - '.github/workflows/concept-model-skill-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concept-model-skill-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 skills/concept-model-engineering/scripts/check_model.py skills/concept-model-engineering/examples/cross-system-journey.json
      - run: python3 -m unittest discover -s skills/concept-model-engineering/tests -v
      - run: python3 -m py_compile skills/concept-model-engineering/scripts/*.py
