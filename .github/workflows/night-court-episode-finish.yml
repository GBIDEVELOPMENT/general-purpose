name: Night Court one-pass episode finish queue
on:
  pull_request:
    paths:
      - '.github/workflows/night-court-episode-finish.yml'
      - 'Night Court/tools/episode_finish.py'
      - 'Night Court/tools/test_episode_finish.py'
      - 'Night Court/tools/test_episode_finish_workbench.js'
      - 'Night Court/tools/source_once_canonical_voice.py'
      - 'Night Court/tools/test_source_once_canonical_voice.py'
      - 'Night Court/tools/preflight_original_media_transport.py'
      - 'Night Court/tools/test_preflight_original_media_transport.py'
      - 'Night Court/episode-finish-workbench.html'
  # Deliberately chained from successful canonical publication.
  # GITHUB_TOKEN is allowed to trigger repository_dispatch; ordinary bot pushes
  # are not a reliable trigger and would risk racing a stale screenplay write.
  repository_dispatch:
    types: [night-court-canonical-published]
  push:
    branches: [main]
    paths:
      - 'Night Court/research/trigger-original-pilot-audio-evidence.txt'
  workflow_dispatch:

# One current source-bounded packet per episode. No recurring version factory.
concurrency:
  group: night-court-one-pass-episode-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare-current-episodes:
    if: >-
      github.repository == 'GBIDEVELOPMENT/general-purpose' &&
      github.event.repository.private == true &&
      github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check reusable original-source S09 soundtrack audio locators
        if: github.event_name != 'pull_request'
        id: locator
        run: |
          if test -s 'Night Court/saved-private/episode-finish-current/S09E19-original-audio-locators.json'; then
            echo 'already_committed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_committed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import EXISTING original-film 231/347 lexical seek evidence once
        if: github.event_name != 'pull_request' && steps.locator.outputs.already_committed == 'false'
        uses: actions/download-artifact@v4
        with:
          name: night-court-original-s09-347-paragraph-audio-locators
          run-id: 40253914693
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-s09-source-evidence
      - name: Stage source-hashed numeric S09 seeks in stable private review output
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/episode-finish-current"
          if test -s 'Night Court/saved-private/episode-finish-current/S09E19-original-audio-locators.json'; then
            cp 'Night Court/saved-private/episode-finish-current/S09E19-original-audio-locators.json' \
              "${RUNNER_TEMP}/episode-finish-current/S09E19-original-audio-locators.json"
          else
            cp "${RUNNER_TEMP}/original-s09-source-evidence/night-court-s09-original-audio-paragraph-locators.json" \
              "${RUNNER_TEMP}/episode-finish-current/S09E19-original-audio-locators.json"
          fi
      - name: Source-first tests and complete P0/P1 AV review agenda per pilot
        run: |
          set -euo pipefail
          PYTHONPATH='Night Court/tools' python -m unittest -v test_episode_finish test_source_once_canonical_voice test_preflight_original_media_transport
          node 'Night Court/tools/test_episode_finish_workbench.js'
          locator=()
          if test -s "${RUNNER_TEMP}/episode-finish-current/S09E19-original-audio-locators.json"; then
            locator=(--s09-original-audio-locator "${RUNNER_TEMP}/episode-finish-current/S09E19-original-audio-locators.json")
          fi
          python 'Night Court/tools/episode_finish.py' \
            --episode both \
            --snapshot 'Night Court/saved-private/pilot-current' \
            --output "${RUNNER_TEMP}/episode-finish-current" "${locator[@]}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'episode-finish-current'
          counts={'S01E01':(405,404,275,34),'S09E19':(323,322,234,27)}
          for ep,(blocks,boundaries,groups,batches) in counts.items():
              x=json.loads((root/f'{ep}-one-pass-av-review.json').read_text())
              assert x['source_reader_blocks']==blocks
              assert len(x['all_adjacent_boundary_questions'])==boundaries
              assert x['provisional_display_groups']==groups
              assert x['review_passes_required']==batches
              if os.environ.get('GITHUB_EVENT_NAME')!='pull_request' and ep=='S09E19':
                  assert x['unverified_source_audio_locator_match_count']==231
                  assert x['original_audio_locator_report_sha256']
                  assert any(z['source_window_kind'].startswith('unverified_original_audio_lexical')
                             for z in x['sequential_one_pass_batches'])
              assert not x['script_final_or_full_episode_accepted']
              assert not x['original_audio_video_inspected_by_this_command']
              assert all(not b['whole_original_av_played_and_verified']
                         for b in x['sequential_one_pass_batches'])
          print('Source-led P0 coverage: all 726 candidate adjacent boundaries'
                ' and all 728 reader blocks; zero synthetic AV approvals')
          PY
      - name: Stage exactly two small SHA-guarded private review packets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: night-court-one-pass-current-av-review-agendas
          path: ${{ runner.temp }}/episode-finish-current/
          retention-days: 7
          if-no-files-found: error

  persist-current-episode-agendas:
    needs: prepare-current-episodes
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: night-court-one-pass-current-av-review-agendas
          path: ${{ runner.temp }}/one-pass-packet
      - name: Refuse stale source snapshot and validate each packet afresh
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || {
            echo "::warning::Source advanced; refusing outdated AV queue."
            exit 1
          }
          python 'Night Court/tools/episode_finish.py' \
            --episode both \
            --snapshot 'Night Court/saved-private/pilot-current' \
            --s09-original-audio-locator "${RUNNER_TEMP}/one-pass-packet/S09E19-original-audio-locators.json" \
            --output "${RUNNER_TEMP}/one-pass-regenerated"
          for ep in S01E01 S09E19; do
            cmp "${RUNNER_TEMP}/one-pass-regenerated/${ep}-one-pass-av-review.json" \
                "${RUNNER_TEMP}/one-pass-packet/${ep}-one-pass-av-review.json"
          done
      - name: Save only the current episode agendas, no vNN files
        run: |
          set -euo pipefail
          dest='Night Court/saved-private/episode-finish-current'
          mkdir -p "$dest"
          cp "${RUNNER_TEMP}/one-pass-packet/"*'-one-pass-av-review.json' "$dest/"
          cp "${RUNNER_TEMP}/one-pass-packet/S09E19-original-audio-locators.json" "$dest/"
          git add -- "$dest"
          if git diff --cached --quiet; then
            echo 'Current one-pass review agendas already preserved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Night Court: preserve current one-pass pilot AV review agendas'
          git push origin HEAD:main


  original-soundtrack-single-pass:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'GBIDEVELOPMENT/general-purpose' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-first current-canonical and audio-plan tests (offline)
        run: |
          set -euo pipefail
          PYTHONPATH='Night Court/tools' python -m unittest -v test_source_once_canonical_voice
          python 'Night Court/tools/source_once_canonical_voice.py' --offline-plan \
            --output "${RUNNER_TEMP}/unused"
      - name: Check original-film server protocol BEFORE downloading any model weights
        env:
          FTP_HOST: wood.seedhost.eu
        run: |
          set -euo pipefail
          python 'Night Court/tools/preflight_original_media_transport.py' \
            --host "$FTP_HOST" --tries 3 --timeout 7 --delay 2 \
            --output "${RUNNER_TEMP}/original-media-preflight.json"
      - name: Authenticate exact owner FTP media source before CPU model install
        env:
          FTP_HOST: wood.seedhost.eu
          FTP_USER: ianseeds
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ftp
        run: |
          set -euo pipefail
          PYTHONPATH='Night Court/tools' python - <<'PY'
          import ftplib
          from source_once_canonical_voice import original_media_login
          ftp=original_media_login()
          try:
              ftp.voidcmd("NOOP")
          finally:
              try:
                  ftp.quit()
              except ftplib.all_errors:
                  ftp.close()
          print("Original-film media FTP control authenticated; no media transferred or AV certification.")
          PY
      - name: Install isolated pinned CPU voice dependencies with visible errors
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/nc-source-voice-env"
          VP="${RUNNER_TEMP}/nc-source-voice-env/bin/python"
          "$VP" -m pip --version
          df -h "${RUNNER_TEMP}"
          timeout 420 "$VP" -m pip install --disable-pip-version-check \
            --no-input --retries 2 --timeout 25 --prefer-binary \
            'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          timeout 360 "$VP" -m pip install --disable-pip-version-check \
            --no-input --retries 2 --timeout 25 --prefer-binary \
            'resemblyzer==0.1.4' 'numpy==1.26.4'
          "$VP" -c 'import torch, numpy, resemblyzer; print("CPU PyTorch",torch.__version__,"numpy",numpy.__version__)'
          # Voice evidence requires FFmpeg audio decoding, NOT apt/ffprobe.
          # Bundled x86_64 Linux wheel pinned to published PyPI SHA256.
          cat > "${RUNNER_TEMP}/nc-ffmpeg-wheel-requirements.txt" <<'REQ'
          imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282
          REQ
          timeout 80 "$VP" -m pip install --disable-pip-version-check \
            --no-input --only-binary=:all: --no-deps --require-hashes \
            -r "${RUNNER_TEMP}/nc-ffmpeg-wheel-requirements.txt"
          "$VP" - <<'PY'
          import imageio_ffmpeg,os,subprocess
          exe=imageio_ffmpeg.get_ffmpeg_exe()
          assert os.path.isfile(exe) and os.access(exe,os.X_OK)
          subprocess.run([exe,'-version'],stdout=subprocess.DEVNULL,check=True,timeout=10)
          print("Pinned bundled source-audio FFmpeg ready; no system apt dependency.")
          PY
      - name: One checksum-pinned original-film acquisition and acoustic analysis per episode
        env:
          FTP_HOST: wood.seedhost.eu
          FTP_USER: ianseeds
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/nc-source-voice-env/bin/python" -u 'Night Court/tools/source_once_canonical_voice.py' \
            --episode both --output "${RUNNER_TEMP}/source-p0p1"
      - name: Check both episode acoustic reports are safe and original-SHA-linked
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'source-p0p1'
          pins={'S01E01':'5b607acc60fae6893aa76e5b02fc34900cbe68050eac486b31382dc91e504962',
                'S09E19':'51f409c620245f9f3744b1b38e534122fd8c82cfadc2221bf5f6fc14eac93649'}
          for ep,sha in pins.items():
              path=root/f'{ep}-original-audio-p0p1-evidence.json'
              d=json.loads(path.read_text('utf-8'))
              assert d['schema']=='night-court-canonical-original-audio-p0-p1-evidence/1'
              assert d['original_video_sha256']==sha
              assert d['voice_embedding_windows_usable']>10
              assert d['original_video_watched_by_human'] is False
              assert d['independent_original_actor_voice_accepted']==0
              assert d['independent_performed_turns_accepted']==0
              assert d['media_audio_pcm_embedding_vectors_or_credentials_preserved'] is False
              assert path.stat().st_size<200000
              print(ep,'sound windows',d['voice_embedding_windows_usable'],
                    'uncertified role suggestions',d['model_eligible_speaker_suggestions'],
                    'P0 acoustic pair checks',len(d['adjacent_P0_original_audio_voice_similarity']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: night-court-original-film-canonical-audio-p0p1-private
          path: ${{ runner.temp }}/source-p0p1/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve exactly current two source-audio reports, no new manuscript version
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse origin/main)" = "${{ github.sha }}" || {
            echo "::error::Source main advanced; refusing stale report.";exit 1;
          }
          dest='Night Court/saved-private/episode-finish-current'
          mkdir -p "$dest"
          cp "${RUNNER_TEMP}/source-p0p1/"*-original-audio-p0p1-evidence.json "$dest/"
          # Attach only source SHA-matched model hints to the two existing AV
          # review agendas. Original roles and performed turns remain unverified.
          python 'Night Court/tools/episode_finish.py' \
            --episode both \
            --snapshot 'Night Court/saved-private/pilot-current' \
            --s09-original-audio-locator "$dest/S09E19-original-audio-locators.json" \
            --output "${RUNNER_TEMP}/source-p0p1-packets"
          cp "${RUNNER_TEMP}/source-p0p1-packets/"*-one-pass-av-review.json "$dest/"
          git add -- "$dest"
          if git diff --cached --quiet; then
            echo 'Original audio model proposals identical; no new commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Night Court: save real original-film acoustic P0/P1 evidence, unverified'
          git push origin HEAD:main
