name: Night Court practical caption-first screenplay draft source-free QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_caption_first_working_drafts.py'
      - 'Night Court/tools/test_build_caption_first_working_drafts.py'
      - 'Night Court/CAPTION-FIRST-WORKING-SCREENPLAY-POLICY.md'
      - '.github/workflows/night-court-caption-first-working-drafts-ci.yml'
      - '.github/workflows/night-court-trusted-caption-first-working-drafts.yml'
      - 'Night Court/seasons/S01/S01E01/derived/caption-first-working-draft-v1/**'
      - 'Night Court/seasons/S09/S09E19/derived/caption-first-working-draft-v1/**'
permissions:
  contents: read
jobs:
  source-free:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original fingerprints, complete pilot cue coverage and no fake scene acceptance
        run: |
          python 'Night Court/tools/test_build_caption_first_working_drafts.py'
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S01E01 --output-root "${{ runner.temp }}/captions"
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S09E19 --output-root "${{ runner.temp }}/captions"
