name: Night Court targeted late-season caption recovery
on:
  pull_request:
    paths:
      - 'Night Court/research/unheld-original-series-caption-page-candidates.csv'
      - 'Night Court/tools/acquire_remaining_caption_candidates.py'
      - 'Night Court/tools/import_remaining_caption_candidates.py'
      - '.github/workflows/night-court-unheld-caption-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: night-court-unheld-caption-candidates
  cancel-in-progress: false
jobs:
  source-acquisition:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/night-court-unheld-targeted-direct-srt-factory')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/night-court-unheld-targeted-direct-srt-factory
          persist-credentials: true
      - name: Validate 89-episode source candidate manifest without network
        run: python "Night Court/tools/acquire_remaining_caption_candidates.py" --output "${{ runner.temp }}/night-court-candidate-check"
      - name: Recover bounded candidate-page English SRTs
        run: python "Night Court/tools/acquire_remaining_caption_candidates.py" --download --output "${{ runner.temp }}/night-court-caption-staging"
      - name: Preserve original acquired bytes and source evidence even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-unheld-caption-source-staging
          path: ${{ runner.temp }}/night-court-caption-staging/
          if-no-files-found: error
          retention-days: 7
      - name: Preflight and import verified retrieved tracks
        run: |
          python "Night Court/tools/import_remaining_caption_candidates.py" "${{ runner.temp }}/night-court-caption-staging"
          python "Night Court/tools/audit_dialogue_quality.py"
          python "Night Court/tools/audit_dialogue_coverage.py"
          python "Night Court/tools/compare_dialogue_versions.py"
          python "Night Court/tools/audit_holdings.py"
          python "Night Court/tools/build_dialogue_source_queue.py"
          python "Night Court/tools/validate_dialogue.py"
          python "Night Court/tools/validate.py"
      - name: Commit only canonical Night Court source and corpus reports to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Night Court/"
          if ! git diff --cached --quiet; then
            git commit -m "data(night-court): preserve recovered S05-S09 dialogue witnesses"
            git push origin HEAD:research/night-court-unheld-targeted-direct-srt-factory
          fi
