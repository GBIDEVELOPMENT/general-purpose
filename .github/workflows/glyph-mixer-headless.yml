name: Glyph Mixer headless build
on:
  pull_request:
    paths:
      - 'GlyphMixer/headless/**'
      - 'GlyphMixer/recipes/**'
      - 'GlyphMixer/test-fonts/**'
      - '.github/workflows/glyph-mixer-headless.yml'
  workflow_dispatch:
    inputs:
      recipe_path:
        description: 'Repository-relative JSON recipe to compile'
        type: string
        default: 'GlyphMixer/recipes/example-uppercase-alternates.json'
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build and verify OpenType features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RECIPE_PATH: ${{ inputs.recipe_path || 'GlyphMixer/recipes/example-uppercase-alternates.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'GlyphMixer/headless/requirements.txt'
      - name: Install pinned headless font dependencies
        run: python -m pip install -r GlyphMixer/headless/requirements.txt
      - name: Syntax and real fontTools unit tests
        run: |
          python -m compileall -q GlyphMixer/headless
          python -m unittest discover -s GlyphMixer/headless/tests -p 'test_*.py' -v
      - name: Inventory every checked-in font archive
        run: |
          python GlyphMixer/headless/cli.py inventory --output GlyphMixer/build/fixture-inventory.json > /dev/null
          python -c 'import json; x=json.load(open("GlyphMixer/build/fixture-inventory.json")); print("Archives scanned:",x["archives"]); print("Font members:",sum(len(i["members"]) for i in x["items"])); print("Parse errors:",sum("error" in m for i in x["items"] for m in i["members"]))'
      - name: Build the requested or example headless recipe
        run: python GlyphMixer/headless/cli.py build --recipe "$RECIPE_PATH"
      - name: Confirm generated OpenType table and report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fontTools.ttLib import TTFont
          outputs=list(Path('GlyphMixer/build').glob('*.report.json'))
          assert outputs, 'Missing build report'
          report=json.loads(max(outputs,key=lambda p:p.stat().st_mtime).read_text())
          path=Path(report['output'])
          assert path.is_file(), 'Missing generated font'
          font=TTFont(path)
          if report['features']:
              assert 'GSUB' in font
          assert len(font.getBestCmap())==report['mapped_characters']
          print('Output:',path,'glyphs:',report['glyphs'],'features:',report['features'])
          print('Warnings:',report['warnings'][:10])
          PY
      - name: Save fonts, reports and fixture inventory as build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glyph-mixer-headless-${{ github.run_id }}
          path: GlyphMixer/build/
          if-no-files-found: warn
          retention-days: 14
