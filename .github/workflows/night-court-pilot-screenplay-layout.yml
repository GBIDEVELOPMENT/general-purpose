name: Night Court two-pilot screenplay layout

on:
  pull_request:
    paths:
      - 'Night Court/tools/render_current_pilot_screenplays.py'
      - 'Night Court/tools/test_render_current_pilot_screenplays.py'
      - 'Night Court/tools/export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_export_fan_retrieval_chunks.py'
      - 'Night Court/tools/apply_manual_context_pilot_review_v16.py'
      - 'Night Court/tools/test_apply_manual_context_pilot_review_v16.py'
      - 'Night Court/research/manual-context-editorial-speaker-review-v16.json'
      - '.github/workflows/night-court-pilot-screenplay-layout.yml'
  push:
    branches: [main]
    paths:
      - 'Night Court/tools/render_current_pilot_screenplays.py'
      - 'Night Court/tools/test_render_current_pilot_screenplays.py'
      - 'Night Court/tools/export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_export_fan_retrieval_chunks.py'
      - 'Night Court/tools/apply_manual_context_pilot_review_v16.py'
      - 'Night Court/tools/test_apply_manual_context_pilot_review_v16.py'
      - 'Night Court/research/manual-context-editorial-speaker-review-v16.json'
      - '.github/workflows/night-court-pilot-screenplay-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-private-layout-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and source-first privacy/integrity regressions
        env:
          PYTHONPATH: Night Court/tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile \
            'Night Court/tools/render_current_pilot_screenplays.py' \
            'Night Court/tools/test_render_current_pilot_screenplays.py' \
            'Night Court/tools/export_fan_retrieval_chunks.py' \
            'Night Court/tools/test_export_fan_retrieval_chunks.py' \
            'Night Court/tools/apply_manual_context_pilot_review_v16.py' \
            'Night Court/tools/test_apply_manual_context_pilot_review_v16.py'
          python -m unittest -v test_render_current_pilot_screenplays test_export_fan_retrieval_chunks test_apply_manual_context_pilot_review_v16
      - name: Reject unexpected committed source-derived manuscripts outside approved private paths
        run: |
          set -euo pipefail
          # Preserve explicit durable private snapshots under PR #499.
          tracked="$(git ls-files -- ':(glob)Night Court/**/*-working-screenplay.md' \
                                    ':(glob)Night Court/**/*-working-screenplay-provenance.jsonl' \
                                    ':(glob)Night Court/**/working-screenplay-layout-manifest.json')"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              'Night Court/saved-private/pilot-current/'*) ;;
              'Night Court/seasons/S09/S09E19/derived/editorial-v17/S09E19-editorial-v17-working-screenplay.md') ;;
              *) echo "::error::Unexpected full dialogue outside approved paths: $path"; exit 1 ;;
            esac
          done <<< "$tracked"
