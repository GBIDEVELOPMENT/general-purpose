name: Night Court two-pilot screenplay layout

on:
  pull_request:
    paths:
      - 'Night Court/tools/render_current_pilot_screenplays.py'
      - 'Night Court/tools/test_render_current_pilot_screenplays.py'
      - '.github/workflows/night-court-pilot-screenplay-layout.yml'
  push:
    branches: [main]
    paths:
      - 'Night Court/tools/render_current_pilot_screenplays.py'
      - 'Night Court/tools/test_render_current_pilot_screenplays.py'
      - '.github/workflows/night-court-pilot-screenplay-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-private-layout-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and source-first privacy/integrity regressions
        env:
          PYTHONPATH: Night Court/tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile \
            'Night Court/tools/render_current_pilot_screenplays.py' \
            'Night Court/tools/test_render_current_pilot_screenplays.py'
          python -m unittest -v test_render_current_pilot_screenplays
      - name: Reject accidental committed generated manuscripts
        run: |
          if git ls-files 'Night Court/**/working-screenplay.md' \
                          'Night Court/**/working-screenplay-provenance.jsonl' \
                          'Night Court/**/working-screenplay-layout-manifest.json' \
                          | grep .; then
            echo 'Private complete dialogue must not be committed'
            exit 1
          fi
