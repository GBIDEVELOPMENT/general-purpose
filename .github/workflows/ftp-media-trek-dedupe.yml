name: FTP prune reviewed duplicate Star Trek episode files
on:
  pull_request:
    paths:
      - 'media-organizer/trek_dedupe.py'
      - 'media-organizer/tests/test_trek_dedupe.py'
      - 'media-organizer/approved-trek-dedupe.json'
      - '.github/workflows/ftp-media-trek-dedupe.yml'
  push:
    branches: [main]
    paths: ['media-organizer/approved-trek-dedupe.json']
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ftp-trek-dedupe-pr-{0}', github.event.pull_request.number) || 'ftp-trek-dedupe-trusted' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test duplicate selection and live-retained preflight logic
        run: |
          python -m py_compile media-organizer/trek_dedupe.py
          python -m unittest discover -s media-organizer/tests -v
          if [ -f media-organizer/approved-trek-dedupe.json ]; then
            python media-organizer/trek_dedupe.py
          fi
  delete:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ftp-media-changes
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PROTOCOL: ftp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prune only exact losers with a live, verified retained counterpart
        run: |
          test -n "$FTP_PASSWORD"
          python media-organizer/trek_dedupe.py --apply
      - name: Always retain exact deletion journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-trek-duplicate-pruning-journal
          path: media-organizer/trek-dedupe-output/
          if-no-files-found: warn
          retention-days: 90
