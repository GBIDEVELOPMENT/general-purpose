name: Night Court trusted correction of original pilot Selma-Bull exchange
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-pilot-quote-correction.txt'
permissions:
  contents: write
jobs:
  publish-reviewed-corrected-pilot:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-pilot-quote-correction-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - run: |
          python 'Night Court/tools/test_build_s01_quote_correction_v4.py'
          python 'Night Court/tools/build_s01_quote_correction_v4.py'
          python 'Night Court/tools/build_s01_quote_correction_v4.py' --check
      - name: Publish corrected full pilot screenplay on isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-pilot-source-quote-corrected-v4-20261024'
          git add -- 'Night Court/seasons/S01/S01E01/derived/pilot-quote-corrected-screenplay-v4'
          git diff --cached --check
          git commit -m 'Night Court: correct Bull speaking cue from independent episode dialogue quote'
          git push origin HEAD:refs/heads/data/night-court-pilot-source-quote-corrected-v4-20261024
