name: Night Court 193-episode AV evidence production queue
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_av_script_production_queue.py'
      - 'Night Court/tools/test_av_script_production_queue.py'
      - '.github/workflows/night-court-av-evidence-queue.yml'
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/night-court-193-av-evidence-production-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/night-court-193-av-evidence-production-queue
          persist-credentials: true
      - name: Verify 193 source, video filename and pending AV stages
        run: |
          python "Night Court/tools/test_av_script_production_queue.py"
          python "Night Court/tools/build_av_script_production_queue.py"
          python "Night Court/tools/validate_dialogue.py"
      - name: Commit durable 193 source-linked AV stage workboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Night Court/catalog/av-script-reconstruction-queue.json"
          if ! git diff --cached --quiet; then
            git commit -m "data(night-court): reconcile all 193 episode audiovisual reconstruction work items"
            git push origin HEAD:feature/night-court-193-av-evidence-production-queue
          fi
