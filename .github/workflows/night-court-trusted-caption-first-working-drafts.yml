name: Night Court trusted owner original-source caption-first working drafts publication
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-caption-first-working-pilots.txt'
permissions:
  contents: write
concurrency:
  group: night-court-caption-first-working-draft-source-safe
  cancel-in-progress: false
jobs:
  generate-pilot-drafts:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-caption-first-working-pilots-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout reviewed trusted main base SHA only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Validate held original dialogue and render two complete source-dialogue working drafts
        run: |
          python 'Night Court/tools/test_build_caption_first_working_drafts.py'
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S01E01
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S09E19
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S01E01 --check
          python 'Night Court/tools/build_caption_first_working_drafts.py' --episode S09E19 --check
      - name: Commit derived pilot drafts only to separate editor review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-caption-first-working-pilots-20261024'
          git add -- 'Night Court/seasons/S01/S01E01/derived/caption-first-working-draft-v1' 'Night Court/seasons/S09/S09E19/derived/caption-first-working-draft-v1'
          git diff --cached --check
          git commit -m 'Night Court: render caption-led source-complete working drafts for two pilots'
          git push origin HEAD:refs/heads/data/night-court-caption-first-working-pilots-20261024
