name: Night Court real S09 original soundtrack speaker comparison

on:
  pull_request:
    paths:
      - 'Night Court/tools/compare_s09_original_speaker_embeddings.py'
      - 'Night Court/tools/test_compare_s09_original_speaker_embeddings.py'
      - 'Night Court/tools/apply_source_role_amendments.py'
      - 'Night Court/research/source-role-amendments-v1.json'
      - 'Night Court/tools/apply_source_turn_amendments.py'
      - 'Night Court/tools/test_apply_source_turn_amendments.py'
      - 'Night Court/research/source-turn-amendments-v1.json'
      - '.github/workflows/night-court-s09-original-speaker-matching.yml'
      - 'Night Court/tools/plan_next_speaker_review_v9.py'
      - 'Night Court/tools/test_plan_next_speaker_review_v9.py'
      - 'Night Court/tools/triage_internal_speaker_switches.py'
      - 'Night Court/tools/build_s09_mixed_voice_turns_v11.py'
      - 'Night Court/tools/test_build_s09_mixed_voice_turns_v11.py'
      - 'Night Court/research/probable-internal-speaker-switches-v1.json'
      - 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py'
      - 'Night Court/tools/build_s09_explicit_handoff_turns_v13.py'
      - 'Night Court/tools/test_build_s09_explicit_handoff_turns_v13.py'
      - 'Night Court/research/s09-explicit-address-speaker-turns-v13.json'
      - 'Night Court/tools/apply_s01_c219_source_turn.py'
      - 'Night Court/tools/render_current_pilot_screenplays.py'
      - 'Night Court/tools/test_render_current_pilot_screenplays.py'
      - 'Night Court/tools/export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_apply_s01_c219_source_turn.py'
      - 'Night Court/tools/validate_s01_c219_p0_split.py'
      - 'Night Court/tools/apply_source_role_amendments.py'
      - 'Night Court/tools/test_apply_source_role_amendments.py'
      - 'Night Court/research/source-role-amendments-v1.json'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-original-s09-speaker-embedding.txt'

permissions:
  contents: read

concurrency:
  group: night-court-original-s09-role-embeddings-${{ github.event_name == 'pull_request_target' && 'trusted' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-original-speaker-evidence-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic S09 source paragraph/voice integrity and abstention tests
        run: |
          python 'Night Court/tools/test_compare_s09_original_speaker_embeddings.py' -v

  source-v8-speaker-reference-planning-with-real-numeric-audio:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original S09 actual soundtrack lexical-locator NUMERIC-only artifact
        uses: actions/download-artifact@v4
        with:
          name: night-court-original-s09-347-paragraph-audio-locators
          run-id: 40253914693
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/s09-source-numeric
      - name: Build latest 587-role source-backed pilot character evidence locally without media
        run: |
          python 'Night Court/tools/build_external_speaker_reader_v6.py' \
            --output '${{ runner.temp }}/s09-v6'
          python 'Night Court/tools/build_contextual_speaker_reader_v7.py' \
            --v6 '${{ runner.temp }}/s09-v6' \
            --output '${{ runner.temp }}/s09-v7'
          python 'Night Court/tools/build_original_audio_speaker_reader_v8.py' \
            --v7 '${{ runner.temp }}/s09-v7' \
            --output '${{ runner.temp }}/s09-v8'
      - name: Count additional original S09 voice reference roles at three measured source lexical thresholds
        env:
          AUDIO: ${{ runner.temp }}/s09-source-numeric/night-court-s09-original-audio-paragraph-locators.json
          ROLE_ROOT: ${{ runner.temp }}/s09-v8
          TEMP_OUT: ${{ runner.temp }}/s09-source-v8-reference-sensitivity
        run: |
          set -euo pipefail
          for COVERAGE in 0.72 0.60 0.50; do
            python 'Night Court/tools/compare_s09_original_speaker_embeddings.py' \
              --source-alignment "$AUDIO" \
              --v8-source-roles "$ROLE_ROOT" \
              --minimum-coverage "$COVERAGE" \
              --output "$TEMP_OUT-$COVERAGE.json" --plan-only
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["TEMP_OUT"])
          for c in ("0.72","0.60","0.50"):
              p=json.loads(Path(str(root)+"-"+c+".json").read_text())
              assert p["original_source_paragraphs_total"]==347
              assert p["original_audio_paragraphs_with_candidate_windows"]==231
              assert p["original_paragraphs_remain_untimed"] is True
              assert p["original_speech_identity_human_verified"] is False
              assert p["voice_reference_source"]=="latest_587_named_v8_provisional_originals"
              print("coverage",c,"named roles with >=4 source candidate windows:",
                    p["candidate_reference_role_counts"],
                    "unknown source candidate windows:",len(p["previously_unidentified_audio_windows"]))
          PY
      - name: Reconcile all 130 current source UNKNOWNs against authentic sound location evidence
        run: |
          python 'Night Court/tools/build_s09_source_acoustic_speaker_reader_v9.py' \
            --current-v8 '${{ runner.temp }}/s09-v8' \
            --output '${{ runner.temp }}/s09-v9'
          python 'Night Court/tools/build_s09_source_turns_v10.py' \
            --v9 '${{ runner.temp }}/s09-v9' \
            --output '${{ runner.temp }}/s09-v10'
          python 'Night Court/tools/build_s09_mixed_voice_turns_v11.py' \
            --v10 '${{ runner.temp }}/s09-v10' \
            --output '${{ runner.temp }}/s09-v11'
          python 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py' \
            --v11 '${{ runner.temp }}/s09-v11' \
            --output '${{ runner.temp }}/s09-v12'
          python 'Night Court/tools/build_s09_explicit_handoff_turns_v13.py' \
            --v12 '${{ runner.temp }}/s09-v12' \
            --output '${{ runner.temp }}/s09-v13'
          python 'Night Court/tools/apply_source_role_amendments.py' \
            --v13 '${{ runner.temp }}/s09-v13' \
            --output '${{ runner.temp }}/s09-source-role-patches'
          python 'Night Court/tools/apply_source_turn_amendments.py' \
            --source-role-patches '${{ runner.temp }}/s09-source-role-patches' \
            --output '${{ runner.temp }}/s09-source-turn-patches'
          python 'Night Court/tools/apply_s01_c219_source_turn.py' \
            --source-turn-patches '${{ runner.temp }}/s09-source-turn-patches' \
            --output '${{ runner.temp }}/s09-source-turns-v15'
          python 'Night Court/tools/render_current_pilot_screenplays.py' \
            --source-first-v15 '${{ runner.temp }}/s09-source-turns-v15' \
            --output '${{ runner.temp }}/s09-current-private-readable-pilots'
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --working-pilot-root '${ runner.temp }/s09-current-private-readable-pilots' \
            --output '${ runner.temp }/s09-current-private-fan-retrieval'
          python 'Night Court/tools/plan_next_speaker_review_v9.py' \
            --s01-p0-root '${{ runner.temp }}/s09-source-turns-v15' \
            --s09-original-audio-locator '${{ runner.temp }}/s09-source-numeric/night-court-s09-original-audio-paragraph-locators.json' \
            --output '${{ runner.temp }}/s09-next-130-private-speaker-review'
          python 'Night Court/tools/triage_internal_speaker_switches.py' \
            --output '${{ runner.temp }}/s09-p0-original-internal-turns'
          python - <<'PY'
          from pathlib import Path
          import json,os
          base=Path(os.environ['RUNNER_TEMP'])
          out=base/'s09-next-130-private-speaker-review'
          m=json.loads((out/'remaining-130-speaker-review-summary.json').read_text('utf-8'))
          assert m['original_source_units']==751
          assert m['original_units_provisionally_named']==621
          assert m['original_source_units_still_unknown']==130
          assert m['unknown_source_unit_review_records']>=131
          assert m['s09_actual_audio_window_leads']>0
          assert m['new_speaker_names_automatically_assigned']==0
          assert m['new_voices_human_accepted']==0
          assert m['original_untimed_S09_captions_modified'] is False
          q=[json.loads(x) for x in (out/'remaining-130-speaker-review.jsonl').read_text().splitlines()]
          assert all(ref not in x['unidentified_original_unit_refs'] for x in q
                     if x['episode_id']=='S09E19' for ref in ('C102.1','C103.1'))
          assert all('C266.1' not in x['unidentified_original_unit_refs'] for x in q if x['episode_id']=='S09E19')
          assert all(ref not in x['unidentified_original_unit_refs'] for x in q if x['episode_id']=='S09E19' for ref in
                     ('C127.1','C146.1','C284.1','C091.1','C092.1',
                      'C099.1','C125.1','C126.1','C134.1','C135.1',
                      'C268.1','C298.1','C299.1','C335.1','C336.1',
                      'C337.1','C340.1','C341.1'))
          assert all(ref not in x['unidentified_original_unit_refs'] for x in q if x['episode_id']=='S09E19' for ref in
                     ('C188.1','C189.1','C190.1','C191.1','C192.1'))
          assert all(ref not in x['unidentified_original_unit_refs'] for x in q if x['episode_id']=='S09E19' for ref in
                     ('C112.1','C114.1','C115.1','C117.1','C118.1','C122.1'))
          assert any(x['source_reading_ref']=='C129.1' and x['model_proposed_character'] is None for x in q)
          c219=[x for x in q if x['episode_id']=='S01E01' and
                x['source_reading_ref'].startswith('S01E01-C219-SOURCE-TURN-')]
          assert len(c219)==2
          assert all(x['unidentified_original_unit_refs']==['C219.1'] for x in c219)
          assert all(x['actual_original_voice_actor_name_verified'] is False for x in c219)
          assert all(x['actual_original_sound_candidate_window_ms']==[878332,883530] for x in c219)
          triage=json.loads((base/'s09-p0-original-internal-turns'/'potential-within-caption-summary.json').read_text('utf-8'))
          assert triage['provisional_inside_original_cue_switch_questions']==16
          assert triage['last_episode_original_untimed_candidate_count']==15
          assert sum(m['remaining_unknown_original_source_units_by_episode'].values())==130
          assert m['original_source_cue_numbers_only_no_dialogue'] is True
          assert all(len(v)<=10 for v in m['largest_contiguous_unknown_original_source_runs'].values())
          print('Source-only unidentified voice counts by pilot:',
                m['remaining_unknown_original_source_units_by_episode'])
          for episode,spans in m['largest_contiguous_unknown_original_source_runs'].items():
              print(episode,'largest unresolved original cue runs (cue IDs/length only):',
                    [(x['start_source_cue'],x['end_source_cue'],x['unknown_source_units'])
                     for x in spans[:5]])
          print('All 130 current UNKNOWN source units now queued with original audio locators, 16 P0 intra-cue review questions and disputed C129 still UNKNOWN')
          PY
      - name: Validate both actual source-first readable screenplay drafts, source SHA and private-only provenance
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'s09-current-private-readable-pilots'
          data=json.loads((base/'working-screenplay-layout-manifest.json').read_text('utf-8'))
          assert data['source_unit_counts']=={'original_source_units':751,'named_provisional':621,'unknown':130}
          assert data['new_independently_verified_actor_voices']==0
          assert data['new_independently_verified_performed_turns']==0
          assert data['scene_review_complete'] is False
          assert set(data['episodes'])=={'S01E01','S09E19'}
          total=0
          for episode, n in [('S01E01',405),('S09E19',321)]:
              manuscript=base/f'{episode}-working-screenplay.md'
              sidecar=base/f'{episode}-working-screenplay-provenance.jsonl'
              assert manuscript.is_file() and sidecar.is_file()
              assert hashlib.sha256(manuscript.read_bytes()).hexdigest()==data['manuscript_sha256'][episode]
              rows=[json.loads(x) for x in sidecar.read_text('utf-8').splitlines()]
              assert len(rows)==n==data['episodes'][episode]['source_blocks']
              assert all(r['actual_original_av_reviewer_accepted'] is False for r in rows)
              assert all(r['source_cue_times_not_subturn_times_ms'] is None for r in rows) if episode=='S09E19' else True
              total+=len(rows)
              print(episode,'private current manuscript source blocks',len(rows),'display groups',data['episodes'][episode]['display_groups'])
          assert total==726
          assert data['episodes']['S01E01']['source_blocks']>0
          assert data['episodes']['S09E19']['source_blocks']>0
          print('Validated both real held-caption working manuscripts without publishing private dialogue')
          retrieval=base/'s09-current-private-fan-retrieval'
          manifest=json.loads((retrieval/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert manifest['episode_count']==193
          assert manifest['contains_original_source_dialogue'] is True
          assert manifest['all_speakers_and_staging_provisional'] is True
          pilot={x['episode_id']:x for x in manifest['episodes'] if x['episode_id'] in ('S01E01','S09E19')}
          assert set(pilot)=={'S01E01','S09E19'}
          assert all(x['evidence_tier']=='provisional_source_first_chronological_screenplay_layout' for x in pilot.values())
          assert manifest['chunk_count']>193
          print('193-source fan retrieval now indexes current chronological scripts for both pilots, no source dialogue published')
          PY
      - name: Compare newest original S09 soundtrack role-bank coverage before expensive acoustic model work
        env:
          AUDIO: ${{ runner.temp }}/s09-source-numeric/night-court-s09-original-audio-paragraph-locators.json
          ROLE_ROOT: ${{ runner.temp }}/s09-source-role-patches
          REPORT: ${{ runner.temp }}/s09-current-source-voice-plan.json
        run: |
          python 'Night Court/tools/compare_s09_original_speaker_embeddings.py' \
            --source-alignment "$AUDIO" \
            --speaker-patch-root "$ROLE_ROOT" \
            --output "$REPORT" --plan-only
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ["REPORT"]).read_text("utf-8"))
          assert p["original_source_paragraphs_total"]==347
          assert p["original_audio_paragraphs_with_candidate_windows"]==231
          assert p["voice_reference_source"]=="latest_619_named_source_role_patches_original_untimed"
          assert p["original_paragraphs_remain_untimed"] is True
          assert p["original_speech_identity_human_verified"] is False
          assert len(p["candidate_reference_role_counts"])>=3
          assert all(len(x)>=4 for x in p["reference_audio_windows"].values())
          assert p["potentially_multivoice_or_weak_alignment_rejected_count"]>0
          assert all(x["original_source_paragraph"] not in
                     {34,102,121,127,146,188,189,190,191,206,209,211,220,225,240,271,277,284,290,291}
                     for xs in p["reference_audio_windows"].values() for x in xs)
          print("Latest source-numeric S09 candidate voice-bank roles:",
                p["candidate_reference_role_counts"],
                "unidentified original paragraph audio windows:",
                len(p["previously_unidentified_audio_windows"]),
                "actor identification independently accepted: 0")
          PY
      - name: Erase private source/role-derived text and numeric audio leads
        if: always()
        run: |
          rm -rf '${{ runner.temp }}/s09-current-private-readable-pilots'
          rm -rf '${{ runner.temp }}/s09-current-private-fan-retrieval'
          rm -rf '${{ runner.temp }}/s09-v6' '${{ runner.temp }}/s09-v7' '${{ runner.temp }}/s09-v8' '${{ runner.temp }}/s09-source-numeric'
          rm -rf '${{ runner.temp }}/s09-v9' '${{ runner.temp }}/s09-v10' '${{ runner.temp }}/s09-v11' '${{ runner.temp }}/s09-v12' '${{ runner.temp }}/s09-v13' '${{ runner.temp }}/s09-source-role-patches' '${{ runner.temp }}/s09-source-turn-patches' '${{ runner.temp }}/s09-source-turns-v15' '${{ runner.temp }}/s09-next-130-private-speaker-review' '${{ runner.temp }}/s09-p0-original-internal-turns'
          rm -f '${{ runner.temp }}/s09-source-v8-reference-sensitivity-'*.json
          rm -f '${{ runner.temp }}/s09-current-source-voice-plan.json'

  notify-trusted-original-s09-speaker-run:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-speaker-embedding-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Post S09 source run locator with no FTP/media data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body="Original 1992 Night Court S09 voice-source comparison workflow: $RUN_URL. Result is pending; no original actor voice identity certified."

  trusted-original-s09-audio-voice-comparison:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-speaker-embedding-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Use reviewed main commit only, NEVER unreviewed PR head code with secrets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only tests before any private original film access
        run: |
          python 'Night Court/tools/test_compare_s09_original_speaker_embeddings.py' -v
          python 'Night Court/tools/test_build_pilot_character_evidence.py' -v
      - name: Obtain previous exact-source S09 audio alignment NUMERIC evidence only
        uses: actions/download-artifact@v4
        with:
          name: night-court-original-s09-347-paragraph-audio-locators
          run-id: 40253914693
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/night-court-s09-numeric-audio-locators
      - name: Rebuild current source-SHA-checked 619-name cast candidate bank from original captions
        run: |
          python 'Night Court/tools/build_external_speaker_reader_v6.py' \
            --output '${{ runner.temp }}/night-court-s09-v6'
          python 'Night Court/tools/build_contextual_speaker_reader_v7.py' \
            --v6 '${{ runner.temp }}/night-court-s09-v6' \
            --output '${{ runner.temp }}/night-court-s09-v7'
          python 'Night Court/tools/build_original_audio_speaker_reader_v8.py' \
            --v7 '${{ runner.temp }}/night-court-s09-v7' \
            --output '${{ runner.temp }}/night-court-s09-v8'
          python 'Night Court/tools/build_s09_source_acoustic_speaker_reader_v9.py' \
            --current-v8 '${{ runner.temp }}/night-court-s09-v8' \
            --output '${{ runner.temp }}/night-court-s09-v9'
          python 'Night Court/tools/build_s09_source_turns_v10.py' \
            --v9 '${{ runner.temp }}/night-court-s09-v9' \
            --output '${{ runner.temp }}/night-court-s09-v10'
          python 'Night Court/tools/build_s09_mixed_voice_turns_v11.py' \
            --v10 '${{ runner.temp }}/night-court-s09-v10' \
            --output '${{ runner.temp }}/night-court-s09-v11'
          python 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py' \
            --v11 '${{ runner.temp }}/night-court-s09-v11' \
            --output '${{ runner.temp }}/night-court-s09-v12'
          python 'Night Court/tools/build_s09_explicit_handoff_turns_v13.py' \
            --v12 '${{ runner.temp }}/night-court-s09-v12' \
            --output '${{ runner.temp }}/night-court-s09-v13'
          python 'Night Court/tools/apply_source_role_amendments.py' \
            --v13 '${{ runner.temp }}/night-court-s09-v13' \
            --output '${{ runner.temp }}/night-court-s09-source-role-patches'
      - name: Reconcile original S09 231-source audio paragraphs against current 619-name source bank
        run: |
          python 'Night Court/tools/compare_s09_original_speaker_embeddings.py' \
            --source-alignment '${{ runner.temp }}/night-court-s09-numeric-audio-locators/night-court-s09-original-audio-paragraph-locators.json' \
            --speaker-patch-root '${{ runner.temp }}/night-court-s09-source-role-patches' \
            --minimum-coverage 0.72 \
            --plan-only --output '${{ runner.temp }}/night-court-s09-speaker-reference-plan.json'
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['RUNNER_TEMP'],'night-court-s09-speaker-reference-plan.json').read_text('utf-8'))
          assert p['original_source_paragraphs_total']==347
          assert p['original_audio_paragraphs_with_candidate_windows']==231
          assert p['original_paragraphs_remain_untimed'] is True
          assert p['original_speech_identity_human_verified'] is False
          assert p['voice_reference_source']=='latest_619_named_source_role_patches_original_untimed'
          assert p['minimum_source_lexical_coverage_for_voice_reference']==0.72
          assert p['candidate_reference_role_counts']=={
              'CHRISTINE SULLIVAN':12,'DAN FIELDING':5,'MAC ROBINSON':4,'ROZ RUSSELL':7
          }
          assert len(p['previously_unidentified_audio_windows'])==18
          print('28 original S09 candidate voice reference windows across four source-checked proposed characters;'
                ' 18 previously unidentified audio candidates, no AV identity accepted')
          PY
      - name: Install pinned CPU-only local speaker identification runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sudo apt-get update -qq
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m venv /tmp/night-court-original-s09-voice
          timeout 500 /tmp/night-court-original-s09-voice/bin/pip install -q --disable-pip-version-check \
            'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          timeout 360 /tmp/night-court-original-s09-voice/bin/pip install -q --disable-pip-version-check \
            'resemblyzer==0.1.4' 'numpy==1.26.4'
      - name: Compare actual original-S09 soundtrack voice embeddings; no original audio retained
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          timeout 900 /tmp/night-court-original-s09-voice/bin/python -u \
            'Night Court/tools/compare_s09_original_speaker_embeddings.py' \
            --source-alignment '${{ runner.temp }}/night-court-s09-numeric-audio-locators/night-court-s09-original-audio-paragraph-locators.json' \
            --speaker-patch-root '${{ runner.temp }}/night-court-s09-source-role-patches' \
            --minimum-coverage 0.72 \
            --ftp --output '${{ runner.temp }}/night-court-s09-original-speaker-numeric-proposals.json'
      - name: Retain only source-linked numeric comparison and unverified character hypotheses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-original-s09-role-audio-numeric-proposals
          path: ${{ runner.temp }}/night-court-s09-original-speaker-numeric-proposals.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy source evidence and model scratch after run
        if: always()
        run: |
          rm -rf /tmp/night-court-original-s09-voice
          rm -rf '${{ runner.temp }}/night-court-s09-numeric-audio-locators'
          rm -rf '${{ runner.temp }}/night-court-s09-v6' '${{ runner.temp }}/night-court-s09-v7' '${{ runner.temp }}/night-court-s09-v8' '${{ runner.temp }}/night-court-s09-v9' '${{ runner.temp }}/night-court-s09-v10' '${{ runner.temp }}/night-court-s09-v11' '${{ runner.temp }}/night-court-s09-v12' '${{ runner.temp }}/night-court-s09-v13' '${{ runner.temp }}/night-court-s09-source-role-patches'
          rm -f '${{ runner.temp }}/night-court-s09-speaker-reference-plan.json'
          rm -f '${{ runner.temp }}/night-court-s09-original-speaker-numeric-proposals.json'

  report-original-S09-audio-speaker-candidates:
    needs: trusted-original-s09-audio-voice-comparison
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.trusted-original-s09-audio-voice-comparison.result == 'success' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-speaker-embedding-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: night-court-original-s09-role-audio-numeric-proposals
          path: ${{ runner.temp }}/private-original-s09-voice
      - name: Report exact-source counts without audiovisual data or original dialogue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/private-original-s09-voice/night-court-s09-original-speaker-numeric-proposals.json
        run: |
          set -euo pipefail
          test "$(jq -r '.source_film_sha256' "$REPORT")" = '51f409c620245f9f3744b1b38e534122fd8c82cfadc2221bf5f6fc14eac93649'
          test "$(jq -r '.source_paragraph_sha256' "$REPORT")" = '659beb9c50fabdd1028aac9570999d9a16b36e6d582938e10809cc0c664530b2'
          test "$(jq -r '.original_actor_identity_independently_verified' "$REPORT")" = '0'
          UNKNOWN=$(jq -r '.usable_unknown_source_audio_windows' "$REPORT")
          CAND=$(jq -r '.unverified_acoustic_role_suggestions' "$REPORT")
          RIGHT=$(jq -r '.known_role_holdout_metrics.correctly_recovered_held_out_provisional_roles' "$REPORT")
          N=$(jq -r '.known_role_holdout_metrics.evaluated_provisional_known_voice_samples' "$REPORT")
          READY=$(jq -r '.crossvalidated_acoustic_model_eligible_to_propose' "$REPORT")
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body="Actual source S09E19 speaker model: $UNKNOWN matched previously UNKNOWN original paragraph audio samples, $CAND unverified actor-role suggestions, holdout provisional source roles $RIGHT/$N, model eligible=$READY. ZERO original cast voices independently certified. All 347 original paragraphs remain UNTImED. Numeric/SHA-only proof in private 7-day run artifact."
      - name: Wipe numerical acoustic result
        if: always()
        run: rm -rf '${{ runner.temp }}/private-original-s09-voice'
