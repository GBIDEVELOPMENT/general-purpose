name: Night Court trusted original Kerr courtroom character manuscripts
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-credited-courtroom-speaker-script.txt'
permissions:
  contents: write
jobs:
  source-only-courtroom-script:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-credited-courtroom-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Validate and build original complete dialogue with source-based courtroom roles
        run: |
          python 'Night Court/tools/test_build_credited_courtroom_guest_reader_v3.py'
          python 'Night Court/tools/build_credited_courtroom_guest_reader_v3.py'
          python 'Night Court/tools/build_credited_courtroom_guest_reader_v3.py' --check
      - name: Publish only clean source dialogue and guest credits review index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-s01-case-guest-script-v3-20261024'
          git add -- 'Night Court/seasons/S01/S01E01/derived/cast-courtroom-reading-screenplay-v3'
          git diff --cached --check
          git commit -m 'Night Court: 106 source-anchored original pilot courtroom and Kerr case guest role hypotheses'
          git push origin HEAD:refs/heads/data/night-court-s01-case-guest-script-v3-20261024
