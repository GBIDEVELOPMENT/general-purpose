name: Night Court dialogue witness ingestion

on:
  workflow_dispatch:
  push:
    branches:
      - "research/night-court-dialogue-*"
      - "research/night-court-local-media-*"
    paths:
      - "Night Court/tools/import_dialogue.py"
      - "Night Court/tools/import_dialogue_bundle.py"
      - "Night Court/tools/test_dialogue_bundle.py"
      - "Night Court/tools/compare_dialogue_versions.py"
      - "Night Court/tools/test_dialogue_versions.py"
      - "Night Court/tools/validate_dialogue.py"
      - "Night Court/tools/audit_dialogue_coverage.py"
      - "Night Court/tools/test_import_dialogue.py"
      - "Night Court/tools/audit_dialogue_quality.py"
      - "Night Court/tools/search_dialogue.py"
      - "Night Court/tools/test_dialogue_quality_search.py"
      - "Night Court/tools/extract_local_media.py"
      - "Night Court/tools/test_extract_local_media.py"
      - "Night Court/incoming/**"
      - ".github/workflows/night-court-dialogue-ingestion.yml"

permissions:
  contents: write

concurrency:
  group: night-court-dialogue-ingestion
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 193-episode corpus
        run: python "Night Court/tools/validate.py"
      - name: Run isolated synthetic ingestion tests
        run: python "Night Court/tools/test_import_dialogue.py"
      - name: Ensure FFmpeg for synthetic media regression
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Test DRM-free local media subtitle extraction on synthetic MKV
        run: python "Night Court/tools/test_extract_local_media.py"
      - name: Run source quality and search synthetic tests
        run: python "Night Court/tools/test_dialogue_quality_search.py"
      - name: Test source witness comparison without choosing a canonical transcript
        run: python "Night Court/tools/test_dialogue_versions.py"
      - name: Run synthetic multi-episode ZIP safety and ingestion tests
        run: python "Night Court/tools/test_dialogue_bundle.py"
      - name: Import source-identified ZIP packages with explicit metadata
        run: python "Night Court/tools/import_dialogue_bundle.py" --inbox "Night Court/incoming"
      - name: Import only supplied source files and matching confirmed sidecars
        run: python "Night Court/tools/import_dialogue.py" --inbox "Night Court/incoming"
      - name: Measure suspect gaps and duplicates without assuming completeness
        run: python "Night Court/tools/audit_dialogue_quality.py"
      - name: Smoke test joint source search on licensed capsule summaries
        run: python "Night Court/tools/search_dialogue.py" --source capsules --limit 2 "court"
      - name: Verify held dialogue and source checksum integrity
        run: python "Night Court/tools/validate_dialogue.py"
      - name: Compare held dialogue editions, detect duplications and anomalies
        run: python "Night Court/tools/compare_dialogue_versions.py"
      - name: Build 193-episode dialogue-only gap and completeness audit
        run: python "Night Court/tools/audit_dialogue_coverage.py"
      - name: Rebuild 193-row holdings coverage
        run: python "Night Court/tools/audit_holdings.py"
      - name: Commit additional dialogue witness versions to research branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git add -- "Night Court/"
          if git diff --cached --quiet; then
            echo "No new dialogue versions"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "archive(night-court): ingest source-attributed dialogue witnesses"
          git push origin "HEAD:$GITHUB_REF_NAME"
