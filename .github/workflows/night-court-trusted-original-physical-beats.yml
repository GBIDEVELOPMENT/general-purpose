name: Night Court trusted original sitcom physical business contact sequences
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-original-physical-action-visuals.txt'
permissions:
  contents: read
concurrency:
  group: night-court-original-dense-gag-review
  cancel-in-progress: false
jobs:
  private-original-source:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-original-physical-beats-trigger' &&
      github.event.pull_request.base.ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        episode: [S01E01,S09E19]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source-free original fixed window QA before credentials
        run: python 'Night Court/tools/test_capture_original_physical_beats.py'
      - name: Install bounded still decoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 120s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 'Pillow==11.3.0'
      - name: Download exactly SHA-bound original privately and extract two high-priority physical business windows
        env:
          FTP_HOST: wood.seedhost.eu
          FTP_USER: ianseeds
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python -u 'Night Court/tools/capture_original_physical_beats.py' --ftp \
            --episode "${{ matrix.episode }}" \
            --output "${{ runner.temp }}/night-court-physical/${{ matrix.episode }}"
      - name: Private sampled action stills only, temporary original source removed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-original-physical-beat-samples-${{ matrix.episode }}
          path: ${{ runner.temp }}/night-court-physical/${{ matrix.episode }}/
          if-no-files-found: error
          retention-days: 7
      - name: Clean scratch
        if: always()
        run: rm -rf "${{ runner.temp }}/night-court-physical"
