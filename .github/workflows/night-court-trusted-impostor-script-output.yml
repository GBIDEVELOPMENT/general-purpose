name: Night Court trusted dual impostor S09 original-script reading edition
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-impostor-script-v4.txt'
permissions:
  contents: write
jobs:
  build-source-safe-episode-reading-script:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-impostor-script-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - run: |
          python 'Night Court/tools/test_build_s09_impostor_speaking_reader_v4.py'
          python 'Night Court/tools/build_s09_impostor_speaking_reader_v4.py'
          python 'Night Court/tools/build_s09_impostor_speaking_reader_v4.py' --check
      - name: Publish only original-source complete character-attributed dialogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-s09-dual-impostor-script-v4-20261024'
          git add -- 'Night Court/seasons/S09/S09E19/derived/impostor-scene-reading-screenplay-v4'
          git diff --cached --check
          git commit -m 'Night Court: distinguish two episode impostors in original-source screenplay'
          git push origin HEAD:refs/heads/data/night-court-s09-dual-impostor-script-v4-20261024
