name: PocketBoard Slabthing font migration
on:
  push:
    branches:
      - pocketboard/slabthing-default-font-20261106
    paths:
      - .github/workflows/pocketboard-slabthing-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and install Slabthing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("PocketBoard")
          with zipfile.ZipFile(root / "slabthing-font.zip") as z:
              fonts = [n for n in z.namelist() if n.lower().endswith((".ttf", ".otf")) and not n.startswith("__MACOSX/") and not Path(n).name.startswith("._")]
              if not fonts:
                  raise RuntimeError("No Android-compatible font found in Slabthing ZIP")
              fonts.sort(key=lambda n: (not Path(n).stem.lower().startswith("slabthing"), "regular" not in n.lower(), n.lower().endswith(".otf"), len(n)))
              selected = fonts[0]
              data = z.read(selected)
              if data[:4] not in (b"OTTO", b"\x00\x01\x00\x00", b"true", b"typ1"):
                  raise RuntimeError("Unexpected font signature: " + selected)
              ext = Path(selected).suffix.lower()
              dst = root / "android/app/src/main/res/font" / ("slabthing" + ext)
              dst.write_bytes(data)
              (root / "assets/fonts" / ("Slabthing" + ext)).write_bytes(data)
              print("Selected", selected, "bytes", len(data))
          main = root / "android/app/src/main/java/dev/pocketkeyboard/MainActivity.kt"
          source = main.read_text()
          assert source.count("R.font.morning_rainbow") == 3, "Review font call sites before migration"
          main.write_text(source.replace("R.font.morning_rainbow", "R.font.slabthing"))
          docs = root / "assets/fonts/README.md"
          docs.write_text("# PocketBoard fonts\n\nSlabthing is the canonical default font for all PocketBoard UI text. The owner-provided source archive is `PocketBoard/slabthing-font.zip`; the selected Android-compatible font is stored under `android/app/src/main/res/font/slabthing" + ext + "` and an identical archival copy under `assets/fonts/Slabthing" + ext + "`.\n\nMorning Rainbow is retained as a historical font asset, but is no longer the UI default. Verify licensing before redistribution outside the project.\n")
          PY
      - name: Commit font change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pocketboard-slabthing-migration.yml
          git add PocketBoard/android/app/src/main/java/dev/pocketkeyboard/MainActivity.kt PocketBoard/android/app/src/main/res/font PocketBoard/assets/fonts
          git commit -m "feat(pocketboard): adopt Slabthing as default UI font"
          git push
