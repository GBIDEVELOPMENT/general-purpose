name: Font Shelf Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'FontViewer/**'
      - '.github/workflows/font-shelf-android.yml'
  pull_request:
    paths:
      - 'FontViewer/**'
      - '.github/workflows/font-shelf-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fontshelf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android and validate library contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Ensure Android 35 SDK and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle pinned offline browser dependencies
        run: |
          npm install --prefix FontViewer --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run --prefix FontViewer build:vendor
      - name: Check JavaScript and source contracts
        run: |
          node --check FontViewer/library.js
          node --check FontViewer/.generated/vendor/fontkit.js
          node --check FontViewer/.generated/vendor/fflate.js
          npm test --prefix FontViewer
      - name: Restore stable debug signing key when configured
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          FONTSHELF_DEBUG_KEYSTORE_BASE64: ${{ secrets.FONTSHELF_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FONTSHELF_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Stable debug signing key is required for main builds."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$FONTSHELF_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          expected="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          echo "FONTSHELF_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "FONTSHELF_EXPECTED_CERT_SHA256=$expected" >> "$GITHUB_ENV"
          echo "Stable Font Shelf debug signing key loaded; certificate SHA-256: $expected"
      - name: Build debug APK
        working-directory: FontViewer/android
        run: gradle --no-daemon -PfontshelfVersionCode="$GITHUB_RUN_NUMBER" :app:assembleDebug
      - name: Verify packaged local content
        run: |
          APK=FontViewer/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'assets/library.js'
          unzip -l "$APK" | grep -F 'assets/vendor/fontkit.js'
          unzip -l "$APK" | grep -F 'assets/vendor/fflate.js'
          unzip -l "$APK" | grep -F 'assets/P22 Stanyan Regular Regular.ttf'
          unzip -l "$APK" | grep -F 'assets/ScribbleBoxDemo-gyWq.ttf'
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='$GITHUB_RUN_NUMBER'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > signing-report.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' signing-report.txt
          grep -F 'Signer #1 certificate SHA-256 digest:' signing-report.txt
          if [ -n "${FONTSHELF_EXPECTED_CERT_SHA256:-}" ]; then
            actual="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' signing-report.txt | tr '[:upper:]' '[:lower:]')"
            if [ "$actual" != "$FONTSHELF_EXPECTED_CERT_SHA256" ]; then
              echo "::error::APK signing certificate differs from the configured stable signing key!"
              exit 1
            fi
            echo "Verified exact APK certificate matches the stable signing key."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FontShelf-debug-apk
          path: FontViewer/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
