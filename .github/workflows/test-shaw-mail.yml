name: Shaw mail offline tests

on:
  pull_request:
    paths:
      - 'tools/shaw_*.py'
      - 'tests/test_shaw_mail_gateway.py'
      - 'tests/test_shaw_activesync.py'
      - 'tests/test_shaw_gateway_client.py'
      - 'tests/test_shaw_secret_boundary.py'
      - 'tests/test_shaw_mail.py'
      - 'tests/test_shaw_activesync.py'
      - 'tests/test_shaw_gateway_client.py'
      - '.github/workflows/test-shaw-mail.yml'
      - '.github/workflows/shaw-mail-gateway.yml'
  push:
    branches: [main, feat/shaw-mail-cli]
    paths:
      - 'tools/shaw_*.py'
      - 'tests/test_shaw_mail.py'
      - '.github/workflows/test-shaw-mail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption library
        run: python -m pip install 'cryptography==46.0.4'
      - name: Compile mail client, helper and gateway
        run: python -m py_compile tools/shaw_mail.py tools/shaw_imap_codec.py tools/shaw_mail_protocol.py tools/shaw_mail_gateway.py tools/shaw_gateway_client.py tools/shaw_activesync.py
      - name: Run isolated offline tests
        run: python -m unittest discover -s tests -p 'test_shaw_*.py' -v
