name: Night Court later-season caption accession
on:
  pull_request:
    paths:
      - 'Night Court/research/s05-s09-direct-caption-pages.csv'
      - 'Night Court/tools/download_late_season_captions.py'
      - '.github/workflows/night-court-late-season-captions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-court-late-caption-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate original-series intake manifest
        run: python "Night Court/tools/download_late_season_captions.py" --output "${{ runner.temp }}/nc-dry"
      - name: Download source SRTs
        run: python "Night Court/tools/download_late_season_captions.py" --download --output "${{ runner.temp }}/nc-captions"
      - name: Preserve source witnesses and SHA provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-s05-s09-direct-caption-staging
          path: ${{ runner.temp }}/nc-captions/
          retention-days: 7
          if-no-files-found: warn
