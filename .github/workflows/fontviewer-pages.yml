name: Publish Font Shelf to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'FontViewer/**'
      - '.github/workflows/fontviewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Font Shelf
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage only the FontViewer site
        shell: bash
        run: |
          mkdir -p _site/FontViewer
          cp FontViewer/index.html _site/FontViewer/index.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Shelf</title><meta http-equiv="refresh" content="0;url=FontViewer/"><a href="FontViewer/">Open Font Shelf</a>' > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
