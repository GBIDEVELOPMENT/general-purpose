name: Publish Font Shelf, Glyph Mixer and Rubik's Cube to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'FontViewer/**'
      - 'GlyphMixer/**'
      - 'RubiksCubeLoader/**'
      - '.github/workflows/fontviewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Font Shelf, Glyph Mixer and Cube comparison
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Glyph Mixer scripts and core tests
        run: |
          node --check GlyphMixer/core.js
          node --check GlyphMixer/app.js
          npm install --prefix GlyphMixer --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test --prefix GlyphMixer

      - name: Verify both Rubik's Cube animation loops
        run: node --test RubiksCubeLoader/cycle.test.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage independent applications
        shell: bash
        run: |
          mkdir -p _site/FontViewer _site/GlyphMixer/headless _site/RubiksCubeLoader
          cp FontViewer/index.html _site/FontViewer/index.html
          cp 'FontViewer/P22 Stanyan Regular Regular.ttf' _site/FontViewer/
          test -s '_site/FontViewer/P22 Stanyan Regular Regular.ttf'
          cp RubiksCubeLoader/compare.html _site/RubiksCubeLoader/index.html
          cp RubiksCubeLoader/index.html _site/RubiksCubeLoader/standard.html
          cp RubiksCubeLoader/small-cube.html _site/RubiksCubeLoader/small-cube.html
          test -s _site/RubiksCubeLoader/index.html
          test -s _site/RubiksCubeLoader/standard.html
          test -s _site/RubiksCubeLoader/small-cube.html
          cp GlyphMixer/index.html GlyphMixer/app.js GlyphMixer/core.js GlyphMixer/style.css _site/GlyphMixer/
          cp GlyphMixer/variations-core.js GlyphMixer/variations-ui.js GlyphMixer/compiler-worker.js _site/GlyphMixer/
          cp GlyphMixer/headless/cli.py _site/GlyphMixer/headless/cli.py
          test -s _site/GlyphMixer/headless/cli.py
          test -s _site/GlyphMixer/compiler-worker.js
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Shelf</title><meta http-equiv="refresh" content="0;url=FontViewer/"><a href="FontViewer/">Open Font Shelf</a>' > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
