name: Night Court S09E19 untimed text/source audio anchor offline
on:
  pull_request:
    paths:
      - 'Night Court/tools/match_s09e19_untimed_paragraphs.py'
      - 'Night Court/tools/s09e19_untimed_video_anchor_pilot.py'
      - 'Night Court/tools/test_s09e19_untimed_video_anchor.py'
      - '.github/workflows/night-court-s09e19-source-anchor-offline.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check synthetic matching, original text provenance and source selection
        run: |
          python -m py_compile 'Night Court/tools/match_s09e19_untimed_paragraphs.py' 'Night Court/tools/s09e19_untimed_video_anchor_pilot.py'
          python 'Night Court/tools/test_s09e19_untimed_video_anchor.py'
