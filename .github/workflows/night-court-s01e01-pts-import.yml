name: Night Court original S01E01 shot PTS import QA
on:
  pull_request:
    paths:
      - 'Night Court/seasons/S01/S01E01/derived/shot-change-pts-v1/**'
      - 'Night Court/tools/validate_s01e01_avi_shot_candidate_import.py'
      - 'Night Court/tools/test_s01e01_avi_shot_candidate_import.py'
      - 'Night Court/S01E01-ORIGINAL-SHOT-PTS-HANDOFF.md'
      - '.github/workflows/night-court-s01e01-pts-import.yml'
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'data/night-court-s01e01-real-avi-pts-candidates'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently validate seven original-AVI scene-score proposals
        run: |
          python 'Night Court/tools/test_s01e01_avi_shot_candidate_import.py'
          python 'Night Court/tools/validate_s01e01_avi_shot_candidate_import.py'
