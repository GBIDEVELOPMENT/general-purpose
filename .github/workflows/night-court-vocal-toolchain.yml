name: Night Court vocal analysis toolchain
on:
  pull_request:
    paths:
      - 'Night Court/tools/measure_vocal_performance.py'
      - 'Night Court/tools/test_vocal_performance.py'
      - 'Night Court/tools/setup_vocal_environment.sh'
      - 'Night Court/tools/vocal-requirements-*.txt'
      - 'Night Court/VOCAL-PERFORMANCE-ANALYSIS.md'
      - '.github/workflows/night-court-vocal-toolchain.yml'
  workflow_dispatch:
    inputs:
      install_acoustics:
        description: 'Acquire and test the optional openSMILE/librosa acoustics tier (no weights or episode media)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  offline-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run deterministic synthetic regression
        run: |
          python -m py_compile "Night Court/tools/measure_vocal_performance.py" "Night Court/tools/test_vocal_performance.py"
          python "Night Court/tools/test_vocal_performance.py"
  optional-acoustic-install:
    if: github.event_name == 'workflow_dispatch' && inputs.install_acoustics
    needs: offline-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional openSMILE and librosa without model downloads
        run: |
          python -m pip install -r "Night Court/tools/vocal-requirements-acoustics.txt"
          python - <<'PY'
          import librosa, soundfile, opensmile
          print('acoustic tool imports successful')
          print('librosa',librosa.__version__)
          print('soundfile',soundfile.__version__)
          print('opensmile',opensmile.__version__)
          PY
