name: Night Court source-stable credited S09 original pen pal and campaign dialogue QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_s09_cast_continuity_reader_v3.py'
      - 'Night Court/tools/test_build_s09_cast_continuity_reader_v3.py'
      - 'Night Court/seasons/S09/S09E19/derived/credited-continuity-speakers-v1/**'
      - 'Night Court/seasons/S09/S09E19/derived/cast-continuity-reading-screenplay-v3/**'
      - '.github/workflows/night-court-s09-credited-continuity-qa.yml'
      - '.github/workflows/night-court-trusted-s09-cast-continuity-publish.yml'
permissions:
  contents: read
jobs:
  original-untimed-dialogue-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python 'Night Court/tools/test_build_s09_cast_continuity_reader_v3.py'
          python 'Night Court/tools/build_s09_cast_continuity_reader_v3.py' --output-root "${{ runner.temp }}/cast"
          if test -f 'Night Court/seasons/S09/S09E19/derived/cast-continuity-reading-screenplay-v3/screenplay-cast-continuity.md'; then
            python 'Night Court/tools/build_s09_cast_continuity_reader_v3.py' --check
          fi
