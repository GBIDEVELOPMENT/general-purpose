name: Night Court S09 original soundtrack untimed paragraph alignment

on:
  pull_request:
    paths:
      - 'Night Court/tools/align_s09_original_audio_paragraphs.py'
      - 'Night Court/tools/test_align_s09_original_audio_paragraphs.py'
      - '.github/workflows/night-court-s09-original-audio-paragraph-alignment.yml'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-s09-original-audio-paragraph-alignment.txt'

permissions:
  contents: read

concurrency:
  group: night-court-s09-original-paragraph-sync-${{ github.event_name == 'pull_request_target' && 'trusted-owner' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-untimed-paragraph-source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic positive, abstention and no-invented-original-timing regression
        run: |
          python 'Night Court/tools/test_align_s09_original_audio_paragraphs.py' -v
      - name: Inspect actual 347 original UNTIMED source paragraphs, no movie
        run: |
          python 'Night Court/tools/align_s09_original_audio_paragraphs.py' --offline-plan-only --output /tmp/nc-not-used.json

  announce-owner-original-s09-audio-run:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-original-audio-align-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Post private owner source run locator without credentials or episode media
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/issues/$PULL/comments" \
            -f body="Trusted Night Court original S09 untimed-caption-to-soundtrack ASR locator: $RUN_URL. Numeric run location only; no exact original cue timestamps, voice identities or film verification accepted."

  trusted-original-S09-untimed-paragraph-audio:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-original-audio-align-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact trusted source base, never unreviewed PR-head code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact original S09 source text and all synthetic alignment invariants
        run: |
          python 'Night Court/tools/test_align_s09_original_audio_paragraphs.py' -v
          python 'Night Court/tools/align_s09_original_audio_paragraphs.py' --offline-plan-only --output /tmp/source-s09-plan.json
      - name: Install fixed local-only original ASR decoder
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sudo apt-get update -qq
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m venv /tmp/night-court-s09-local-asr
          timeout 480 /tmp/night-court-s09-local-asr/bin/pip install -q --disable-pip-version-check \
            'faster-whisper==1.2.1'
      - name: Original source S09 AVI once, one PCM, Whisper audio-word to source-paragraph candidates
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          timeout 960 /tmp/night-court-s09-local-asr/bin/python -u \
            'Night Court/tools/align_s09_original_audio_paragraphs.py' --ftp \
            --output '${{ runner.temp }}/night-court-s09-original-audio-paragraph-locators.json'
      - name: Retain only candidate numeric audio interval suggestions and source hashes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-original-s09-347-paragraph-audio-locators
          path: ${{ runner.temp }}/night-court-s09-original-audio-paragraph-locators.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete any retained numeric source report and transient model env
        if: always()
        run: |
          rm -rf /tmp/night-court-s09-local-asr
          rm -f '${{ runner.temp }}/night-court-s09-original-audio-paragraph-locators.json'

  report-s09-original-untimed-audio-numeric-candidates:
    needs: trusted-original-S09-untimed-paragraph-audio
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.trusted-original-S09-untimed-paragraph-audio.result == 'success' &&
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.ref == 'research/night-court-owner-s09-original-audio-align-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: night-court-original-s09-347-paragraph-audio-locators
          path: ${{ runner.temp }}/private-s09-source-times
      - name: Post numerical S09 source result, not source transcript or soundtrack
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          SOURCE: ${{ runner.temp }}/private-s09-source-times/night-court-s09-original-audio-paragraph-locators.json
        run: |
          set -euo pipefail
          test "$(jq -r '.original_video_sha256' "$SOURCE")" = '51f409c620245f9f3744b1b38e534122fd8c82cfadc2221bf5f6fc14eac93649'
          test "$(jq -r '.original_untimed_source_sha256' "$SOURCE")" = '659beb9c50fabdd1028aac9570999d9a16b36e6d582938e10809cc0c664530b2'
          test "$(jq -r '.original_speaker_identities_verified' "$SOURCE")" = '0'
          test "$(jq -r '.exact_subtitle_timecode_recovered' "$SOURCE")" = '0'
          FOUND=$(jq -r '.candidate_source_paragraphs_given_audio_window' "$SOURCE")
          MISSING=$(jq -r '.unlocated_original_source_paragraphs' "$SOURCE")
          MATCHED=$(jq -r '.source_exact_sequence_word_matches' "$SOURCE")
          gh api --method POST "repos/$REPO/issues/$PULL/comments" \
            -f body="Original S09 source soundtrack alignment finished: $FOUND /347 untimed held paragraphs gained provisional ASR-audio windows; $MISSING remain unlocated; $MATCHED source words globally matched. ZERO held original paragraph timestamps changed or certified, ZERO source-audio actor identities verified. Original AVI, PCM, full model wordstream and weights not retained in artifact. Numeric candidate intervals only, 7-day private artifact."
      - name: Remove private numeric report
        if: always()
        run: rm -rf '${{ runner.temp }}/private-s09-source-times'
