name: Night Court trusted two original-caption scripts with in-scene stage directions
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-source-stage-in-scene-v6.txt'
permissions:
  contents: write
concurrency:
  group: night-court-source-photo-script-editorial-v6
  cancel-in-progress: false
jobs:
  render-source-grounded-two-scripts:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-stage-script-v6-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Only trusted main SHA, no untrusted head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Rebuild two source complete screenplays and authentic inline picture stages
        run: |
          python 'Night Court/tools/test_render_in_scene_stage_directions_v6.py'
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S01E01
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S09E19
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S01E01 --check
          python 'Night Court/tools/render_in_scene_stage_directions_v6.py' --episode S09E19 --check
      - name: Only derived source text, metadata and unresolved review tasks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-original-source-inline-stage-v6-20261025'
          git add -- 'Night Court/seasons/S01/S01E01/derived/caption-first-source-stage-in-scene-v6' 'Night Court/seasons/S09/S09E19/derived/caption-first-source-stage-in-scene-v6'
          git diff --cached --check
          git commit -m 'Night Court: attach original source-observed stage directions inside timed dialogue'
          git push origin HEAD:refs/heads/data/night-court-original-source-inline-stage-v6-20261025
