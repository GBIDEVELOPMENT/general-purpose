name: Night Court script factory (one click)
on:
  # Seed the two current canonical pilot readers on initial deployment and
  # after this single factory workflow is changed. Output-only bot pushes
  # cannot re-trigger because saved-private is not in the push path filter.
  push:
    branches: [main]
    paths:
      - '.github/workflows/night-court-script-factory.yml'
      # Main refresh when model-report publisher itself is upgraded. Future
      # Qwen owner jobs regenerate pilot scripts atomically with the report:
      # a GITHUB_TOKEN bot push alone cannot trigger this workflow.
      - '.github/workflows/night-court-owner-qwen-picture-pilot.yml'
      - 'Night Court/tools/script_factory.py'
      - 'Night Court/seasons/**/derived/text-only-speaker-proposals-v*.json'
      - 'Night Court/saved-private/episode-finish-current/*-original-audio-p0p1-evidence.json'
      - 'Night Court/saved-private/episode-finish-current/*-original-qwen-visual-proposals.json'
  # The existing canonical publisher announces a new trusted manuscript.
  # Refresh the same private pilot output paths, never create vNN editions.
  repository_dispatch:
    types: [night-court-canonical-published]
  workflow_dispatch:
    inputs:
      episode:
        description: 'Original Night Court episode, e.g. S05E05, or all (193)'
        required: true
        type: string
        default: S01E01
      publish:
        description: 'Save generated private scripts to main (recommended)'
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - 'Night Court/tools/script_factory.py'
      - 'Night Court/tools/test_script_factory.py'
      - '.github/workflows/night-court-script-factory.yml'
permissions:
  contents: read
concurrency:
  group: night-court-script-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'GBIDEVELOPMENT/general-purpose'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test full original-source corpus, both pilots, source preservation and deterministic second run
        run: |
          set -euo pipefail
          PYTHONPATH='Night Court/tools' python -m unittest -v test_script_factory test_episode_finish
      - name: Smoke the one-command user entrypoint
        run: |
          set -euo pipefail
          python 'Night Court/tools/script_factory.py' --episode S05E05 --output "${RUNNER_TEMP}/script-factory-smoke"
          python 'Night Court/tools/script_factory.py' --episode S01E01 --output "${RUNNER_TEMP}/script-factory-smoke"
          test -s "${RUNNER_TEMP}/script-factory-smoke/S05E05/screenplay.md"
          test -s "${RUNNER_TEMP}/script-factory-smoke/S01E01/manifest.json"
  bootstrap-known-scripts:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'repository_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh canonical pilots and all existing contextual episode readers
        run: |
          set -euo pipefail
          python 'Night Court/tools/script_factory.py' --episode S01E01
          python 'Night Court/tools/script_factory.py' --episode S09E19
          # Discover all existing whole-episode editorial ledgers; the Python
          # factory validates each against its immutable transcript source.
          for path in 'Night Court'/seasons/S??/S??E??/derived/text-only-speaker-proposals-v*.json; do
            test -f "$path" || continue
            episode="$(basename "$(dirname "$(dirname "$path")")")"
            python 'Night Court/tools/script_factory.py' --episode "$episode"
          done
      - name: Upload the strongest current pilots and contextual episode scripts
        uses: actions/upload-artifact@v4
        with:
          name: night-court-script-factory-current-researched-scripts
          path: Night Court/saved-private/script-factory-current/
          retention-days: 7
          if-no-files-found: error
      - name: Safely preserve refreshed scripts to stable private main paths
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Night Court/saved-private/script-factory-current/'
          if ! git diff --cached --quiet; then
            git commit -m 'data(night-court): refresh one-click factory canonical pilots'
            git push origin HEAD:main
          fi

  publish:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Produce strongest currently supported complete available-source draft
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          set -euo pipefail
          python 'Night Court/tools/script_factory.py' \
            --episode "${REQUESTED_EPISODE}" \
            --output 'Night Court/saved-private/script-factory-current'
      - name: Stage only the requested episode(s) for the private download
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/script-factory-package"
          if [[ "${REQUESTED_EPISODE}" == 'all' ]]; then
            cp -a 'Night Court/saved-private/script-factory-current/.' "${RUNNER_TEMP}/script-factory-package/"
          else
            cp -a "Night Court/saved-private/script-factory-current/${REQUESTED_EPISODE}" "${RUNNER_TEMP}/script-factory-package/"
          fi
      - name: Upload private editable screenplay and exact-source review queue
        uses: actions/upload-artifact@v4
        with:
          name: night-court-script-factory-${{ inputs.episode }}
          path: ${{ runner.temp }}/script-factory-package/
          retention-days: 7
          if-no-files-found: error
      - name: Commit only requested stable output (no version proliferation)
        if: inputs.publish == true
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "${REQUESTED_EPISODE}" == 'all' ]]; then
            git add -- 'Night Court/saved-private/script-factory-current/'
          else
            git add -- "Night Court/saved-private/script-factory-current/${REQUESTED_EPISODE}/"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data(night-court): refresh source-guarded script factory output for ${REQUESTED_EPISODE}"
            # Normal fast-forward only: never force or overwrite concurrent editing.
            git push origin HEAD:main
          fi
