name: Night Court S09 original episode two-impostor roles QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_s09_impostor_speaking_reader_v4.py'
      - 'Night Court/tools/test_build_s09_impostor_speaking_reader_v4.py'
      - 'Night Court/seasons/S09/S09E19/derived/credited-impostor-scene-v1/**'
      - 'Night Court/seasons/S09/S09E19/derived/impostor-scene-reading-screenplay-v4/**'
      - '.github/workflows/night-court-impostor-role-qa.yml'
      - '.github/workflows/night-court-trusted-impostor-script-output.yml'
permissions:
  contents: read
jobs:
  original-caption-impostor-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python 'Night Court/tools/test_build_s09_impostor_speaking_reader_v4.py'
          python 'Night Court/tools/build_s09_impostor_speaking_reader_v4.py' --output-root "${{ runner.temp }}/script"
          if test -f 'Night Court/seasons/S09/S09E19/derived/impostor-scene-reading-screenplay-v4/screenplay-impostors.md'; then
            python 'Night Court/tools/build_s09_impostor_speaking_reader_v4.py' --check
          fi
