name: Glyph Mixer checks
on:
  pull_request:
    paths:
      - 'GlyphMixer/**'
      - '.github/workflows/glyph-mixer-checks.yml'
  push:
    branches: [main]
    paths:
      - 'GlyphMixer/**'
      - '.github/workflows/glyph-mixer-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check GlyphMixer/core.js
          node --check GlyphMixer/app.js
      - name: Mapping and font assembly unit tests
        run: node --test GlyphMixer/tests/*.test.cjs
      - name: Verify required static files
        run: |
          test -s GlyphMixer/index.html
          test -s GlyphMixer/app.js
          test -s GlyphMixer/core.js
          test -s GlyphMixer/style.css
