name: Night Court quote-corroborated pilot role correction integrity
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_s01_quote_correction_v4.py'
      - 'Night Court/tools/test_build_s01_quote_correction_v4.py'
      - 'Night Court/seasons/S01/S01E01/derived/editor-reviewed-speaker-corrections-v1/**'
      - 'Night Court/seasons/S01/S01E01/derived/pilot-quote-corrected-screenplay-v4/**'
      - '.github/workflows/night-court-pilot-quote-correction-qa.yml'
      - '.github/workflows/night-court-trusted-pilot-quote-correction.yml'
permissions:
  contents: read
jobs:
  corrected-original-speaking-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python 'Night Court/tools/test_build_s01_quote_correction_v4.py'
          python 'Night Court/tools/build_s01_quote_correction_v4.py' --output-root "${{ runner.temp }}/correction"
          if test -f 'Night Court/seasons/S01/S01E01/derived/pilot-quote-corrected-screenplay-v4/screenplay-quote-corrected.md'; then
            python 'Night Court/tools/build_s01_quote_correction_v4.py' --check
          fi
