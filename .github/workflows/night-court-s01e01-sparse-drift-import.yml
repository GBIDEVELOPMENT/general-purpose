name: Night Court S01E01 sparse whole-cut ASR drift import
on:
  pull_request:
    paths:
      - 'Night Court/tools/import_s01e01_sparse_sync_study.py'
      - 'Night Court/S01E01-SOURCE-CUT-DRIFT-HANDOFF.md'
      - '.github/workflows/night-court-s01e01-sparse-drift-import.yml'
permissions:
  contents: write
  actions: read
jobs:
  retain:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'data/night-court-s01e01-source-cut-drift-review'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/night-court-s01e01-source-cut-drift-review
          persist-credentials: true
      - name: Retrieve exactly previous trusted owner media source experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/sparse-study"
          gh run download 40049969051 --repo gamesbyian/general-purpose \
            --name night-court-s01e01-source-cut-drift-review \
            --dir "${{ runner.temp }}/sparse-study"
      - name: Verify every source subtitle, audio interval and epistemic gate
        run: |
          python "Night Court/tools/import_s01e01_sparse_sync_study.py" \
            "${{ runner.temp }}/sparse-study/s01e01-source-cut-drift.json"
          python "Night Court/tools/validate_dialogue.py"
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("Night Court/seasons/S01/S01E01/derived/source-sync-review-v1")
          x=json.loads((p/"s01e01-sparse-asr-drift.json").read_text())
          assert len(x["windows"])==5
          assert not x["source_edition_audio_sync_verified"]
          assert not x["audiovisual_episode_completeness_verified"]
          assert (p/"s01e01-sparse-asr-drift-review.md").is_file()
          print("Original-source sparse timing differences accepted without false AV sync claim")
          PY
      - name: Commit only bounded derived private-review results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Night Court/seasons/S01/S01E01/derived/source-sync-review-v1/"
          if ! git diff --cached --quiet; then
            git commit -m "data(night-court): retain S01E01 five-window original AVI/SRT sync hypotheses"
            git push origin HEAD:data/night-court-s01e01-source-cut-drift-review
          fi
