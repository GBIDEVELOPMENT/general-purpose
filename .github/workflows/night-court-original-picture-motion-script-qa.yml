name: Night Court source-verified physical business scene screenplay CI
on:
  pull_request:
    paths:
      - 'Night Court/tools/render_caption_first_motion_edit_v3.py'
      - 'Night Court/tools/test_render_caption_first_motion_edit_v3.py'
      - 'Night Court/seasons/S01/S01E01/derived/physical-motion-original-v1/**'
      - 'Night Court/seasons/S09/S09E19/derived/physical-motion-original-v1/**'
      - 'Night Court/seasons/S01/S01E01/derived/caption-first-physical-business-v3/**'
      - 'Night Court/seasons/S09/S09E19/derived/caption-first-physical-business-v3/**'
      - '.github/workflows/night-court-original-picture-motion-script-qa.yml'
      - '.github/workflows/night-court-trusted-picture-motion-script-publish.yml'
permissions:
  contents: read
jobs:
  offline-source-consistency:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source original SHA, image motion, all cues unchanged and no forged AV acceptance
        run: |
          python 'Night Court/tools/test_render_caption_first_motion_edit_v3.py'
          python 'Night Court/tools/render_caption_first_motion_edit_v3.py' --episode S01E01 --output-root "${{ runner.temp }}/script"
          python 'Night Court/tools/render_caption_first_motion_edit_v3.py' --episode S09E19 --output-root "${{ runner.temp }}/script"
          if test -f 'Night Court/seasons/S01/S01E01/derived/caption-first-physical-business-v3/screenplay-motion-edit.md'; then
            python 'Night Court/tools/render_caption_first_motion_edit_v3.py' --episode S01E01 --check
          fi
          if test -f 'Night Court/seasons/S09/S09E19/derived/caption-first-physical-business-v3/screenplay-motion-edit.md'; then
            python 'Night Court/tools/render_caption_first_motion_edit_v3.py' --episode S09E19 --check
          fi
