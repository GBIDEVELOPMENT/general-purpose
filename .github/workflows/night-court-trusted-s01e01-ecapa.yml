name: Night Court trusted S01E01 anonymous speaker similarity
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-s01e01-anonymous-voice.txt'
permissions:
  contents: read
concurrency:
  group: night-court-s01e01-ecapa-source
  cancel-in-progress: false
jobs:
  acoustic-similarity:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-s01e01-anonymous-voice-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Fetch trusted repository code ONLY from base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned compatible CPU speaker-embedding environment
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'speechbrain==1.0.3' 'huggingface_hub>=0.24,<1' 'numpy>=1.26,<3' 'soundfile>=0.12,<0.14'
      - name: Source-independent acoustic similarity synthetic test
        run: python "Night Court/tools/test_s01e01_anonymous_voice_similarity.py"
      - name: Retrieve only owner-approved S01E01 AVI with FTP secret
        env:
          FTP_HOST: wood.seedhost.eu
          FTP_USER: ianseeds
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,ftplib
          from pathlib import Path
          sys.path.insert(0,'Night Court/tools')
          from ftp_research_intake import connect
          from pilot_ftp_video_acoustics import candidate,retrieve
          source=candidate()
          target=Path(os.environ['RUNNER_TEMP'])/'night-court-s01e01-approved.avi'
          ftp=connect(os.environ['FTP_HOST'],os.environ['FTP_USER'],os.environ['FTP_PASSWORD'],'ftp')
          try: fingerprint=retrieve(ftp,source,target)
          finally:
              try:ftp.quit()
              except ftplib.all_errors:ftp.close()
          assert fingerprint=='5b607acc60fae6893aa76e5b02fc34900cbe68050eac486b31382dc91e504962'
          print('Approved source SHA matched, temporary video remains on private runner only')
          PY
      - name: Run external model in separate NO-FTP-SECRET process
        run: |
          python "Night Court/tools/s01e01_anonymous_voice_similarity.py" \
             --media "${{ runner.temp }}/night-court-s01e01-approved.avi" \
             --output "${{ runner.temp }}/s01e01-ecapa-anonymous.json"
      - name: Delete temporary video before uploading derived metadata
        if: always()
        run: rm -f "${{ runner.temp }}/night-court-s01e01-approved.avi"
      - name: Upload anonymous similarity scores only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-court-s01e01-anonymous-voice-similarity
          path: ${{ runner.temp }}/s01e01-ecapa-anonymous.json
          retention-days: 7
          if-no-files-found: error
