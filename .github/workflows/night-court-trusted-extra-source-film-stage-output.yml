name: Night Court trusted original inspected stage new manuscripts
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Night Court/research/trigger-direct-original-extra-stage-script.txt'
permissions:
  contents: write
jobs:
  publish-cited-original-stage-screenplays:
    if: >-
      github.event.pull_request.user.login == 'gamesbyian' &&
      github.event.pull_request.head.repo.full_name == 'gamesbyian/general-purpose' &&
      github.event.pull_request.head.ref == 'research/night-court-inspected-extra-stage-trigger' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Build two complete original-caption manuscripts enriched only from inspected original video
        run: |
          python 'Night Court/tools/test_render_extra_observed_original_stage_v5.py'
          python 'Night Court/tools/render_extra_observed_original_stage_v5.py' --episode S01E01
          python 'Night Court/tools/render_extra_observed_original_stage_v5.py' --episode S09E19
          python 'Night Court/tools/render_extra_observed_original_stage_v5.py' --episode S01E01 --check
          python 'Night Court/tools/render_extra_observed_original_stage_v5.py' --episode S09E19 --check
      - name: Save text scripts/source picture SHA only to separate review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c 'data/night-court-source-photo-stage-v5-20261024'
          git add -- 'Night Court/seasons/S01/S01E01/derived/additional-original-film-staged-reader-v5' 'Night Court/seasons/S09/S09E19/derived/additional-original-film-staged-reader-v5'
          git diff --cached --check
          git commit -m 'Night Court: two real sampled-original picture scene stage notes in full manuscripts'
          git push origin HEAD:refs/heads/data/night-court-source-photo-stage-v5-20261024
