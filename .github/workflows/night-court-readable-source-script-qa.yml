name: Night Court readable caption-first screenplay original source preservation QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/render_readable_caption_screenplay_v5.py'
      - 'Night Court/tools/test_render_readable_caption_screenplay_v5.py'
      - 'Night Court/seasons/S01/S01E01/derived/dialogue-context-speakers-v5/**'
      - 'Night Court/seasons/S09/S09E19/derived/dialogue-context-speakers-v5/**'
      - 'Night Court/seasons/S01/S01E01/derived/caption-first-readable-screenplay-v5/**'
      - 'Night Court/seasons/S09/S09E19/derived/caption-first-readable-screenplay-v5/**'
      - '.github/workflows/night-court-readable-source-script-qa.yml'
      - '.github/workflows/night-court-trusted-readable-script-delivery.yml'
permissions:
  contents: read
jobs:
  complete-original-cue-and-editorial-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all original words source SHA, repair only confirmed wraps, retain unverified roles
        run: |
          python 'Night Court/tools/test_render_readable_caption_screenplay_v5.py'
          python 'Night Court/tools/render_readable_caption_screenplay_v5.py' --episode S01E01 --output-root "${{ runner.temp }}/readable"
          python 'Night Court/tools/render_readable_caption_screenplay_v5.py' --episode S09E19 --output-root "${{ runner.temp }}/readable"
          if test -f 'Night Court/seasons/S01/S01E01/derived/caption-first-readable-screenplay-v5/screenplay-readable.md'; then
            python 'Night Court/tools/render_readable_caption_screenplay_v5.py' --episode S01E01 --check
          fi
          if test -f 'Night Court/seasons/S09/S09E19/derived/caption-first-readable-screenplay-v5/screenplay-readable.md'; then
            python 'Night Court/tools/render_readable_caption_screenplay_v5.py' --episode S09E19 --check
          fi
