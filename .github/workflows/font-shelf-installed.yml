name: Font Shelf installed Android acceptance

on:
  pull_request:
    paths:
      - 'FontViewer/android/**'
      - '.github/workflows/font-shelf-installed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fontshelf-installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    name: Android 35 WebView library lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local browser assets
        run: |
          npm install --prefix FontViewer --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run --prefix FontViewer build:vendor
          npm test --prefix FontViewer
      - name: Compile Android instrumentation APK
        working-directory: FontViewer/android
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Installed UI and persistence test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd FontViewer/android
            gradle --no-daemon :app:connectedDebugAndroidTest
