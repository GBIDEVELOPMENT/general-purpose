name: Generate global presence matrix
on:
  push:
    paths:
      - 'presence/build.py'
      - 'presence/test_build.py'
      - 'presence/travel.py'
      - 'presence/test_travel.py'
      - 'presence/physical.py'
      - 'presence/test_physical.py'
      - '.github/workflows/global-presence.yml'
  workflow_dispatch:
concurrency:
  group: global-presence-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 pycountry==24.6.1
      - run: python -m unittest discover -s presence -p 'test_*.py' -v
      - run: python presence/build.py
      - run: python presence/travel.py
      - run: python presence/physical.py
      - uses: actions/upload-artifact@v4
        with:
          name: global-presence-2024
          path: presence/output/
          retention-days: 90
      - name: Persist generated matrix to feature branch
        run: |
          git config user.name "country-presence-research"
          git config user.email "actions@users.noreply.github.com"
          git add presence/output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish UN 2024 bilateral resident presence dataset"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
