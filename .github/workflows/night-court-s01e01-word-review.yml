name: Night Court source ASR word review
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_s01e01_word_alignment_review.py'
      - 'Night Court/tools/test_s01e01_word_alignment_review.py'
      - '.github/workflows/night-court-s01e01-word-review.yml'
permissions:
  contents: write
jobs:
  review-packet:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/night-court-s01e01-word-evidence-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/night-court-s01e01-word-evidence-alignment
          persist-credentials: true
      - name: Validate source-only, conservative candidate alignment
        run: |
          python -m py_compile "Night Court/tools/build_s01e01_word_alignment_review.py"
          python "Night Court/tools/test_s01e01_word_alignment_review.py"
          python "Night Court/tools/build_s01e01_word_alignment_review.py"
          python "Night Court/tools/validate_dialogue.py"
      - name: Commit only derived review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Night Court/seasons/S01/S01E01/derived/scene-review-v1/word-alignment-review.json" "Night Court/seasons/S01/S01E01/derived/scene-review-v1/word-alignment-review.md"
          if ! git diff --cached --quiet; then
            git commit -m "data(night-court): produce S01E01 word/turn evidence review packet"
            git push origin HEAD:feature/night-court-s01e01-word-evidence-alignment
          fi
