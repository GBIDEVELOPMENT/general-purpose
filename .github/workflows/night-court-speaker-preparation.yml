name: Night Court text-only speaker attribution preparation

on:
  workflow_dispatch:
  push:
    branches:
      - "research/night-court-text-speaker-*"
      - "research/night-court-speaker-*"
      - "research/night-court-scene-*"
    paths:
      - "Night Court/tools/prepare_speaker_attribution.py"
      - "Night Court/tools/test_prepare_speaker_attribution.py"
      - "Night Court/tools/reconcile_speaker_votes.py"
      - "Night Court/tools/test_reconcile_speaker_votes.py"
      - "Night Court/tools/build_scene_participation.py"
      - "Night Court/tools/test_scene_participation.py"
      - "Night Court/seasons/**/speaker-attribution/votes/*.jsonl"
      - "Night Court/TEXT-ONLY-SPEAKER-ATTRIBUTION.md"
      - ".github/workflows/night-court-speaker-preparation.yml"

permissions:
  contents: write

concurrency:
  group: night-court-text-only-speaker-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify currently held 193-episode corpus
        run: |
          python "Night Court/tools/validate.py"
          python "Night Court/tools/validate_dialogue.py"
      - name: Synthetic utterance splitting and evidence tests
        run: python "Night Court/tools/test_prepare_speaker_attribution.py"
      - name: Test evidence-linked agent consensus and abstention
        run: python "Night Court/tools/test_reconcile_speaker_votes.py"
      - name: Prepare available source dialogue into bounded attribution packets
        run: python "Night Court/tools/prepare_speaker_attribution.py"
      - name: Audit episode credits and direct address as separate scene participation signals
        run: |
          python "Night Court/tools/test_scene_participation.py"
          python "Night Court/tools/build_scene_participation.py"
      - name: Reconcile any submitted speaker votes into provisional scripts
        run: python "Night Court/tools/reconcile_speaker_votes.py"
      - name: Revalidate idempotence and stable source references
        run: |
          python "Night Court/tools/prepare_speaker_attribution.py"
          python "Night Court/tools/validate_dialogue.py"
      - name: Commit only derived preparation outputs on research branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git add -- "Night Court/"
          if git diff --cached --quiet; then
            echo "Attribution source packets unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "research(night-court): prepare text-only speaker attribution packets for held episodes"
          git push origin "HEAD:$GITHUB_REF_NAME"
