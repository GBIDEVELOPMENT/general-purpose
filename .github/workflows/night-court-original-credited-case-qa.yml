name: Night Court pilot source-anchored credited courtroom roles QA
on:
  pull_request:
    paths:
      - 'Night Court/tools/build_credited_courtroom_guest_reader_v3.py'
      - 'Night Court/tools/test_build_credited_courtroom_guest_reader_v3.py'
      - 'Night Court/seasons/S01/S01E01/derived/credited-case-speakers-v1/**'
      - 'Night Court/seasons/S01/S01E01/derived/cast-courtroom-reading-screenplay-v3/**'
      - '.github/workflows/night-court-original-credited-case-qa.yml'
      - '.github/workflows/night-court-trusted-credited-case-output.yml'
permissions:
  contents: read
jobs:
  original-courtroom-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python 'Night Court/tools/test_build_credited_courtroom_guest_reader_v3.py'
          python 'Night Court/tools/build_credited_courtroom_guest_reader_v3.py' --output-root "${{ runner.temp }}/guest-court"
          if test -f 'Night Court/seasons/S01/S01E01/derived/cast-courtroom-reading-screenplay-v3/screenplay-courtroom-cast.md'; then
            python 'Night Court/tools/build_credited_courtroom_guest_reader_v3.py' --check
          fi
