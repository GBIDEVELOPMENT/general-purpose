name: Expository smoke
on:
  pull_request:
    paths:
      - 'tools/expository/**'
      - '.github/workflows/expository-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/expository/expository.test.cjs
      - run: bash -n tools/expository/publish-pages.sh
