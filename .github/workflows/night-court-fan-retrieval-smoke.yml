name: Night Court private fan retrieval smoke

on:
  pull_request:
    paths:
      - 'Night Court/tools/export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_export_fan_retrieval_chunks.py'
      - 'Night Court/tools/search_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_search_fan_retrieval_chunks.py'
      - 'Night Court/tools/build_pilot_fan_beat_cards.py'
      - 'Night Court/tools/test_build_pilot_fan_beat_cards.py'
      - 'Night Court/tools/search_fan_corpus.py'
      - 'Night Court/tools/test_search_fan_corpus.py'
      - 'Night Court/research/pilot-fan-beat-seeds-v1.json'
      - 'Night Court/seasons/S01/S01E01/derived/additional-original-film-staged-reader-v5/screenplay-extra-observed-business.md'
      - 'Night Court/seasons/S09/S09E19/derived/additional-original-film-staged-reader-v5/screenplay-extra-observed-business.md'
      - 'Night Court/FAN-OBSESSION-DELIVERABLE-2026-10-25.md'
      - 'Night Court/FAN-LLM-RUNBOOK-2026-10-25.md'
      - '.github/workflows/night-court-fan-retrieval-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python and offline synthetic tests
        run: |
          python --version
          PYTHONPATH='Night Court/tools' python -m unittest -v test_export_fan_retrieval_chunks test_search_fan_retrieval_chunks test_build_pilot_fan_beat_cards test_search_fan_corpus
      - name: Both pilot working scripts
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --pilot-only --output /tmp/night-court-private-fan-pilots
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('/tmp/night-court-private-fan-pilots/fan-retrieval-manifest.json')
          m=json.loads(output.read_text('utf-8'))
          assert m['episode_count']==2 and m['chunk_count']>=2
          assert {r['episode_id'] for r in m['episodes']}=={'S01E01','S09E19'}
          assert all(r['evidence_tier']=='provisional_filmed_staging_working_script' for r in m['episodes'])
          print('Pilot source-SHA-checked retrieval export passed; no dialogue printed')
          PY
      - name: All 193 source witnesses with pilot v5 substitutions
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --output /tmp/night-court-private-fan-all
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('/tmp/night-court-private-fan-all/fan-retrieval-manifest.json')
          m=json.loads(output.read_text('utf-8'))
          assert m['episode_count']==193 and m['chunk_count']>=193
          assert sum(r['evidence_tier']=='source_only_dialogue_scaffold' for r in m['episodes'])==191
          assert sum(r['evidence_tier']=='provisional_filmed_staging_working_script' for r in m['episodes'])==2
          print('193 source-SHA-checked episodes indexed; no dialogue printed or artifacts uploaded')
          PY
      - name: Private original-series lexical search smoke
        run: |
          python 'Night Court/tools/search_fan_retrieval_chunks.py' \
            --corpus /tmp/night-court-private-fan-all/fan-retrieval-chunks.jsonl \
            --query 'Roz pen pal Alex' --episode S09E19 \
            --output /tmp/night-court-private-fan-search-roz.json
          python 'Night Court/tools/search_fan_retrieval_chunks.py' \
            --corpus /tmp/night-court-private-fan-all/fan-retrieval-chunks.jsonl \
            --query 'painting painter' --episode S01E01 \
            --output /tmp/night-court-private-fan-search-painter.json
          python - <<'PY'
          import json
          from pathlib import Path
          samples = [
             ('S01E01', '/tmp/night-court-private-fan-search-painter.json'),
             ('S09E19', '/tmp/night-court-private-fan-search-roz.json'),
          ]
          for episode, filename in samples:
              result = json.loads(Path(filename).read_text('utf-8'))
              assert result['hits'] and all(h['episode_id']==episode for h in result['hits'])
              assert all(not h['speaker_names_verified'] for h in result['hits'])
          print('Both original pilot lexical search queries passed; no dialogue printed or uploaded')
          PY
      - name: Validate original caption anchored fan interpretation cards
        run: |
          python 'Night Court/tools/build_pilot_fan_beat_cards.py' \
            --output /tmp/night-court-private-fan-beats
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/night-court-private-fan-beats/pilot-fan-beat-manifest.json').read_text('utf-8'))
          assert m['card_count']==21 and m['episode_counts']=={'S01E01':10,'S09E19':11}
          assert m['original_media_reviewed_by_this_export'] is False
          print('21 source-anchored pilot cards validated; no original dialogue printed')
          PY
      - name: Join source scripts and explanatory fan beats in private search
        run: |
          python 'Night Court/tools/search_fan_corpus.py' \
            --corpus /tmp/night-court-private-fan-all/fan-retrieval-chunks.jsonl \
            --cards /tmp/night-court-private-fan-beats/pilot-fan-beat-cards.jsonl \
            --query 'Harry double-headed coin justice' --episode S01E01 \
            --output /tmp/night-court-private-joined-coin.json
          python 'Night Court/tools/search_fan_corpus.py' \
            --corpus /tmp/night-court-private-fan-all/fan-retrieval-chunks.jsonl \
            --cards /tmp/night-court-private-fan-beats/pilot-fan-beat-cards.jsonl \
            --query 'Roz Alex substitute impostor' --episode S09E19 \
            --output /tmp/night-court-private-joined-impostors.json
          python - <<'PY'
          import json
          from pathlib import Path
          for episode,name in [
            ('S01E01','/tmp/night-court-private-joined-coin.json'),
            ('S09E19','/tmp/night-court-private-joined-impostors.json')
          ]:
              r=json.loads(Path(name).read_text('utf-8'))
              assert r['script_witness_hits'] and r['editorial_fan_beat_candidates']
              assert all(x['episode_id']==episode for x in r['script_witness_hits'])
              assert all(x['episode_id']==episode and not x['film_staging_verified']
                         for x in r['editorial_fan_beat_candidates'])
          print('Joint source-and-interpretation pilot retrieval passed without text publication')
          PY
