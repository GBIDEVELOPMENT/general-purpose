name: Night Court private fan retrieval smoke

on:
  pull_request:
    paths:
      - 'Night Court/tools/export_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_export_fan_retrieval_chunks.py'
      - 'Night Court/tools/search_fan_retrieval_chunks.py'
      - 'Night Court/tools/test_search_fan_retrieval_chunks.py'
      - 'Night Court/tools/build_pilot_fan_beat_cards.py'
      - 'Night Court/tools/test_build_pilot_fan_beat_cards.py'
      - 'Night Court/tools/search_fan_corpus.py'
      - 'Night Court/tools/test_search_fan_corpus.py'
      - 'Night Court/tools/build_pilot_character_evidence.py'
      - 'Night Court/tools/test_build_pilot_character_evidence.py'
      - 'Night Court/tools/fan_sqlite_index.py'
      - 'Night Court/tools/test_fan_sqlite_index.py'
      - 'Night Court/tools/build_fan_answer_packet.py'
      - 'Night Court/tools/test_build_fan_answer_packet.py'
      - 'Night Court/tools/auto_align_quote_sequence.py'
      - 'Night Court/tools/test_auto_align_quote_sequence.py'
      - 'Night Court/tools/build_external_speaker_reader_v6.py'
      - 'Night Court/tools/test_build_external_speaker_reader_v6.py'
      - 'Night Court/tools/triage_unknown_speakers.py'
      - 'Night Court/tools/test_triage_unknown_speakers.py'
      - 'Night Court/tools/plan_speaker_audio_review.py'
      - 'Night Court/tools/test_plan_speaker_audio_review.py'
      - 'Night Court/tools/build_contextual_speaker_reader_v7.py'
      - 'Night Court/tools/test_build_contextual_speaker_reader_v7.py'
      - 'Night Court/tools/align_private_production_script.py'
      - 'Night Court/tools/test_align_private_production_script.py'
      - 'Night Court/tools/build_original_audio_speaker_reader_v8.py'
      - 'Night Court/tools/test_build_original_audio_speaker_reader_v8.py'
      - 'Night Court/tools/triage_internal_speaker_switches.py'
      - 'Night Court/tools/test_triage_internal_speaker_switches.py'
      - 'Night Court/research/probable-internal-speaker-switches-v1.json'
      - 'Night Court/tools/plan_next_speaker_review_v9.py'
      - 'Night Court/tools/test_plan_next_speaker_review_v9.py'
      - 'Night Court/research/s01e01-source-voice-acoustic-proposals-v1.json'
      - 'Night Court/research/s09-original-source-acoustic-speaker-proposals-v1.json'
      - 'Night Court/tools/build_s09_source_acoustic_speaker_reader_v9.py'
      - 'Night Court/tools/test_build_s09_source_acoustic_speaker_reader_v9.py'
      - 'Night Court/tools/build_s09_source_turns_v10.py'
      - 'Night Court/tools/test_build_s09_source_turns_v10.py'
      - 'Night Court/tools/build_s09_mixed_voice_turns_v11.py'
      - 'Night Court/tools/test_build_s09_mixed_voice_turns_v11.py'
      - 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py'
      - 'Night Court/tools/test_build_s09_high_context_speaker_reader_v12.py'
      - 'Night Court/research/s09-high-context-speaker-proposals-v12.json'
      - 'Night Court/tools/test_s01e01_full_asr_import.py'
      - 'Night Court/tools/validate_s01e01_full_asr_import.py'
      - 'Night Court/seasons/S01/S01E01/derived/scene-review-v4/asr-full-cut-v1/asr-proposals.json'
      - 'Night Court/research/pilot-contextual-speaker-proposals-v1.json'
      - 'Night Court/research/pilot-speaker-external-quote-improvements-v1.json'
      - 'Night Court/AUTOMATIC-QUOTE-SEQUENCE-2026-10-25.md'
      - 'Night Court/research/pilot-fan-beat-seeds-v1.json'
      - 'Night Court/seasons/S01/S01E01/derived/additional-original-film-staged-reader-v5/screenplay-extra-observed-business.md'
      - 'Night Court/seasons/S09/S09E19/derived/additional-original-film-staged-reader-v5/screenplay-extra-observed-business.md'
      - 'Night Court/FAN-OBSESSION-DELIVERABLE-2026-10-25.md'
      - 'Night Court/FAN-LLM-RUNBOOK-2026-10-25.md'
      - '.github/workflows/night-court-fan-retrieval-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python and offline synthetic tests
        run: |
          python --version
          PYTHONPATH='Night Court/tools' python -m unittest -v test_export_fan_retrieval_chunks test_search_fan_retrieval_chunks test_build_pilot_fan_beat_cards test_search_fan_corpus test_build_pilot_character_evidence test_fan_sqlite_index test_build_fan_answer_packet test_auto_align_quote_sequence test_build_external_speaker_reader_v6 test_triage_unknown_speakers test_plan_speaker_audio_review test_build_contextual_speaker_reader_v7 test_align_private_production_script test_build_original_audio_speaker_reader_v8 test_build_s09_source_acoustic_speaker_reader_v9 test_triage_internal_speaker_switches test_plan_next_speaker_review_v9 test_build_s09_source_turns_v10 test_build_s09_mixed_voice_turns_v11 test_build_s09_high_context_speaker_reader_v12 test_s01e01_full_asr_import
      - name: Verify preserved exact original S01 source 36-second audio ASR hypotheses against frozen SRT
        run: |
          python 'Night Court/tools/validate_s01e01_full_asr_import.py' \
            'Night Court/seasons/S01/S01E01/derived/scene-review-v4/asr-full-cut-v1/asr-proposals.json'
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('Night Court/seasons/S01/S01E01/derived/scene-review-v4/asr-full-cut-v1/asr-proposals.json')
          d=json.loads(path.read_text('utf-8'))
          assert d['model_result_count']==12
          assert d['original_source_caption_turns']==11
          assert d['human_listened_to_complete_source_window'] is False
          assert d['speaker_character_diarization_verified'] is False
          assert d['original_caption_words_independently_verified'] is False
          print('Exact source C19-C27 36-second S01 Whisper text and 60 candidate word offsets preserved, no actor/word acceptance')
          PY
      - name: Speaker priority one - generate and check real external quote v6 pilots
        run: |
          python 'Night Court/tools/build_external_speaker_reader_v6.py' \
            --output /tmp/night-court-private-speaker-v6
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-speaker-v6')
          summary=json.loads((base/'speaker-improvement-manifest.json').read_text('utf-8'))
          assert summary['original_source_speaking_units']==751
          assert summary['original_provisional_named_source_units']==487
          assert summary['original_unknown_source_units']==264
          assert summary['new_provisional_named_source_units']==490
          assert summary['remaining_unidentified_source_units']==261
          assert summary['provisional_speaker_segments_from_these_cues']==4
          assert summary['original_audio_speaker_identities_verified_by_this_change']==0
          for ep in ('S01E01','S09E19'):
            assert (base/ep/'screenplay-external-speakers-v6.md').is_file()
          s09=(base/'S09E19'/'screenplay-external-speakers-v6.md').read_text('utf-8')
          assert 'ROZ RUSSELL · P0 SOURCE-CONTINUATION PROPOSAL; AUDIO UNVERIFIED\nme.\n\nCHRISTINE SULLIVAN' in s09
          print('Original-source-anchored S01/S09 speaker v6: 3 new named original units and one restored two-voice split; no media logged')
          PY
      - name: Pilot P1 context proposals against exact original caption sources
        run: |
          python 'Night Court/tools/build_contextual_speaker_reader_v7.py' \
            --v6 /tmp/night-court-private-speaker-v6 \
            --output /tmp/night-court-private-context-speaker-v7
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/night-court-private-context-speaker-v7')
          report=json.loads((out/'pilot-contextual-speaker-manifest.json').read_text('utf-8'))
          assert report['source_units_total']==751
          assert report['source_units_provisionally_named']==583
          assert report['source_units_unknown']==168
          assert report['new_contextual_source_units_proposed']==93
          assert report['new_contextual_reading_blocks']==90
          assert report['audio_confirmed_by_this_pass']==0
          for ep in ['S01E01','S09E19']:
              assert (out/(ep+'-private-speaker-first-v7.md')).is_file()
          print('93 additional original unit IDs carry UNVERIFIED source-context candidate roles; no copyrighted dialogue printed')
          PY
      - name: Source-exact P0 review queue for 16 potential intra-caption voice switches
        run: |
          python 'Night Court/tools/triage_internal_speaker_switches.py' \
            --output /tmp/night-court-private-internal-turn-switches
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/night-court-private-internal-turn-switches')
          m=json.loads((r/'potential-within-caption-summary.json').read_text('utf-8'))
          assert m['provisional_inside_original_cue_switch_questions']==16
          assert m['first_episode_timed_candidate_count']==1
          assert m['last_episode_original_untimed_candidate_count']==15
          assert m['original_caption_speaking_unit_denominator_unchanged']==751
          assert m['actually_verified_new_speaker_switches']==0
          print('16 original source-exact potential internal voice switches queued; no footage/speaker identity accepted')
          PY
      - name: Both pilot working scripts
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --pilot-only --output /tmp/night-court-private-fan-pilots
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('/tmp/night-court-private-fan-pilots/fan-retrieval-manifest.json')
          m=json.loads(output.read_text('utf-8'))
          assert m['episode_count']==2 and m['chunk_count']>=2
          assert {r['episode_id'] for r in m['episodes']}=={'S01E01','S09E19'}
          assert all(r['evidence_tier']=='provisional_filmed_staging_working_script' for r in m['episodes'])
          print('Pilot source-SHA-checked retrieval export passed; no dialogue printed')
          PY
      - name: Speaker-first source-grounded queue for the remaining unknowns
        run: |
          python 'Night Court/tools/triage_unknown_speakers.py' \
            --speaker-v6-root /tmp/night-court-private-speaker-v6 \
            --output /tmp/night-court-private-speaker-review
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/night-court-private-speaker-review/speaker-identity-first-review-summary.json').read_text('utf-8'))
          assert m['source_units_unidentified']==261
          assert m['source_units_unidentified_by_episode']=={'S01E01':97,'S09E19':164}
          assert m['suspected_existing_wrong_labels']==1
          assert m['automatically_accepted_new_names']==0
          assert m['independently_audio_confirmed_by_triage']==0
          print('All 261 unassigned original pilot source units queued for prioritized P0/P1 review; no source dialogue uploaded')
          PY
      - name: Plan bounded actual-source S01 listening windows without decoding media
        run: |
          python 'Night Court/tools/plan_speaker_audio_review.py' \
            --queue /tmp/night-court-private-speaker-review/speaker-identity-first-review.jsonl \
            --output /tmp/night-court-private-speaker-listening-plan.json \
            --max-clips 12
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/night-court-private-speaker-listening-plan.json').read_text('utf-8'))
          assert p['selected_clip_count']>0 and p['selected_clip_count']<=12
          assert p['deferred_untimed_s09_items']>0
          assert p['source_video_audio_processed'] is False
          assert all(x['episode_id']=='S01E01' and x['duration_ms']<=18000
                     and not x['speaker_identity_audio_verified'] for x in p['clip_list'])
          print('Ranked original-source listening windows prepared privately; S09 untimed remains deferred')
          PY
      - name: Speaker-first revised pilot script retrieval with real immutable source text
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v6-root /tmp/night-court-private-speaker-v6 \
            --output /tmp/night-court-private-fan-speaker-v6
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/night-court-private-fan-speaker-v6')
          m=json.loads((out/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_external_quote_speaker_reader_v6' for x in m['episodes'])==2
          assert sum(x['evidence_tier']=='source_only_dialogue_scaffold' for x in m['episodes'])==191
          rows=[json.loads(x) for x in (out/'fan-retrieval-chunks.jsonl').read_text('utf-8').splitlines()]
          s01=''.join(x['retrieval_text'] for x in rows if x['episode_id']=='S01E01')
          s09=''.join(x['retrieval_text'] for x in rows if x['episode_id']=='S09E19')
          assert 'DAN FIELDING · EXTERNALLY QUOTE-ATTRIBUTED; AUDIO UNVERIFIED' in s01
          assert 'CHRISTINE SULLIVAN · EXTERNALLY QUOTE-ATTRIBUTED; AUDIO UNVERIFIED' in s09
          assert 'ROZ RUSSELL · P0 SOURCE-CONTINUATION PROPOSAL; AUDIO UNVERIFIED' in s09
          print('Newly proposed speaker names flow through all-episode retrieval; zero original dialogue printed')
          PY
      - name: Reindex named candidate v7 pilot dialogue into the 193 episode private retrieval
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v7-root /tmp/night-court-private-context-speaker-v7 \
            --output /tmp/night-court-private-fan-speaker-v7
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-fan-speaker-v7')
          m=json.loads((base/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_original_source_speaker_reader_v7' for x in m['episodes'])==2
          assert sum(x['evidence_tier']=='source_only_dialogue_scaffold' for x in m['episodes'])==191
          rows=[json.loads(x) for x in (base/'fan-retrieval-chunks.jsonl').read_text('utf-8').splitlines()]
          s01=''.join(x['retrieval_text'] for x in rows if x['episode_id']=='S01E01')
          assert 'HARRY STONE · narrative_context_candidate_not_voice_verified' in s01
          assert 'LANA WAGNER · narrative_context_candidate_not_voice_verified' in s01
          print('Contextual v7 episode identity views integrated into private retrieval; no media text logged')
          PY
      - name: Improve four original UNNAMED cue roles with actual source soundtrack acoustic evidence
        run: |
          python 'Night Court/tools/build_original_audio_speaker_reader_v8.py' \
            --v7 /tmp/night-court-private-context-speaker-v7 \
            --output /tmp/night-court-private-source-audio-speaker-v8
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-source-audio-speaker-v8')
          m=json.loads((base/'pilot-original-acoustic-speaker-manifest.json').read_text('utf-8'))
          assert m['original_source_caption_units']==751
          assert m['source_units_with_provisional_names']==587
          assert m['original_units_still_unknown']==164
          assert m['new_original_audio_model_supported_provisional_role_units']==4
          assert m['provisional_previous_speaker_roles_corrob_by_acoustics']==2
          assert m['source_speaker_identities_human_verified_by_pass']==0
          print('Real-source voice evidence yields four new unverified roles and two corroborations, no voice ID certification')
          PY
      - name: Search all 193 original-series episodes with current source-acoustic v8 pilot names
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v8-root /tmp/night-court-private-source-audio-speaker-v8 \
            --output /tmp/night-court-private-fan-speaker-v8
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-fan-speaker-v8')
          m=json.loads((base/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_original_source_acoustic_speaker_reader_v8'
                     for x in m['episodes'])==2
          print('Current original-audio voice-based provisional speaker scripts retrieved for both pilots; all 193 source editions conserved')
          PY
      - name: Source-linked three S09 original-audio name suggestions with one rejected false positive
        run: |
          python 'Night Court/tools/build_s09_source_acoustic_speaker_reader_v9.py' \
            --current-v8 /tmp/night-court-private-source-audio-speaker-v8 \
            --output /tmp/night-court-private-source-audio-speaker-v9
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/night-court-private-source-audio-speaker-v9')
          m=json.loads((p/'pilot-current-speaker-s09-audio-v9-manifest.json').read_text('utf-8'))
          assert m['original_source_caption_units']==751
          assert m['current_working_named_provisional_original_units']==590
          assert m['unidentified_original_cue_units']==161
          assert m['original_s09_soundtrack_supported_new_named_proposals']==3
          assert m['quarantined_suspicious_model_proposals']==1
          assert m['original_audio_human_identified_characters_added']==0
          print('590 source-unit provisional names, 161 UNKNOWN, S09 C129 misleading voice-model hint quarantined; no AV actor identity accepted')
          PY
      - name: Real-source v9 speaker-first 193-episode private retrieval without stale S09 UNKNOWN labels
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v9-root /tmp/night-court-private-source-audio-speaker-v9 \
            --output /tmp/night-court-private-fan-speaker-v9
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/night-court-private-fan-speaker-v9')
          m=json.loads((p/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_original_s09_audio_speaker_reader_v9'
                     for x in m['episodes'])==2
          print('Pilot true original v9 provisional speaker manuscripts integrated into 193-episode private retrieval, no media or dialogue printed')
          PY
      - name: Reunite one continuing original S09 sentence without inventing voice certainty
        run: |
          python 'Night Court/tools/build_s09_source_turns_v10.py' \
            --v9 /tmp/night-court-private-source-audio-speaker-v9 \
            --output /tmp/night-court-private-speaker-turns-v10
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/night-court-private-speaker-turns-v10')
          m=json.loads((p/'pilot-current-source-turns-v10-manifest.json').read_text('utf-8'))
          assert m['original_caption_immutable_source_units']==751
          assert m['current_provisional_character_named_original_units']==591
          assert m['still_unknown_original_source_units']==160
          assert m['reader_speaker_turn_blocks_before']==716
          assert m['reader_speaker_turn_blocks_after']==715
          assert m['one_joined_source_turn_refs']==['C266.1','C267.1']
          assert m['source_audio_human_actor_identity_confirmations_added']==0
          assert m['original_S09_transcript_still_untimed'] is True
          print('Original source S09 C266/C267 grammatical continuation reunited as one proposed turn, 591 provisional names, 160 UNKNOWN')
          PY
      - name: Source-immutable v10 full original-series local private fan retrieval
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v10-root /tmp/night-court-private-speaker-turns-v10 \
            --output /tmp/night-court-private-fan-speaker-v10
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads((Path('/tmp/night-court-private-fan-speaker-v10')/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_source_turn_reunion_v10'
                     for x in m['episodes'])==2
          print('193 held original-series witnesses intact, current two-pilot source-turn screenplay indexed privately')
          PY
      - name: Correct original C188-C192 unpunctuated multiple-voice exchange with exact source spans
        run: |
          python 'Night Court/tools/build_s09_mixed_voice_turns_v11.py' \
            --v10 /tmp/night-court-private-speaker-turns-v10 \
            --output /tmp/night-court-private-speaker-turns-v11
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-speaker-turns-v11')
          m=json.loads((base/'pilot-current-multi-voice-turns-v11-manifest.json').read_text('utf-8'))
          assert m['original_caption_units']==751
          assert m['provisional_named_original_units']==595
          assert m['original_units_remaining_unknown']==156
          assert m['private_provisional_reading_turn_blocks_before']==715
          assert m['private_provisional_reading_turn_blocks_after']==716
          assert m['candidate_scene_turns_inserted']==6
          assert m['original_source_fully_reconstructable_via_unicode_spans'] is True
          assert m['actual_audio_review_performed'] is False
          assert m['potential_character_voice_and_turn_verifications_from_actual_original_av']==0
          print('Original S09 five multi-voice paragraphs reorganized into six source-conserving provisional turns; all original dialogue remains exact and original S09 clocks null')
          PY
      - name: Full original 193 episode private v11 source-turn search and manuscript coverage
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v11-root /tmp/night-court-private-speaker-turns-v11 \
            --output /tmp/night-court-private-fan-speaker-v11
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/night-court-private-fan-speaker-v11')
          m=json.loads((base/'fan-retrieval-manifest.json').read_text('utf-8'))
          assert m['episode_count']==193
          assert sum(x['evidence_tier']=='provisional_source_mixed_voice_reader_v11'
                     for x in m['episodes'])==2
          print('193 original source episodes private reader indexed with Roz/Christine original 1992 dialogue broken into provisional P0 turns, source SHA conserved')
          PY
      - name: Apply twelve source-constrained original S09 dialogue-role proposals to private v12
        run: |
          python 'Night Court/tools/build_s09_high_context_speaker_reader_v12.py' \
            --v11 /tmp/night-court-private-speaker-turns-v11 \
            --output /tmp/night-court-private-speaker-context-v12
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/night-court-private-speaker-context-v12')
          m=json.loads((p/'pilot-original-speaker-context-v12-manifest.json').read_text('utf-8'))
          assert m['original_caption_source_units']==751
          assert m['current_provisional_character_named_original_units']==610
          assert m['still_unknown_original_source_units']==141
          assert m['current_original_speaker_reading_blocks']==716
          assert m['previously_unidentified_reader_blocks_now_contextually_named']==12
          assert m['new_original_caption_parts_with_working_names']==15
          assert m['original_soundtrack_actor_identities_independently_reviewed_and_accepted']==0
          assert m['original_S09_source_still_untimed'] is True
          print('15 original source cue parts now provisionally named from 12 anchored character-context clues; 141 UNKNOWN; none accepted as source actor or voice ID')
          PY
      - name: Private source first 193-episode v12 named-role reader reaches LLM retrieval
        run: |
          python 'Night Court/tools/export_fan_retrieval_chunks.py' \
            --speaker-v12-root /tmp/night-court-private-speaker-context-v12 \
            --output /tmp/night-court-private-fan-speaker-v12
          python - <<'PY'
