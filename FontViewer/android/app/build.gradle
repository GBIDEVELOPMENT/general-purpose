plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gbidevelopment.fontshelf'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gbidevelopment.fontshelf'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDirs("$buildDir/generated/fontShelfAssets")

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

tasks.register('stageFontShelfAssets', Copy) {
    from('../../index.html', '../../library.js',
         '../../P22 Stanyan Regular Regular.ttf',
         '../../ScribbleBoxDemo-gyWq.ttf')
    from('../../.generated/vendor') { into 'vendor' }
    into "$buildDir/generated/fontShelfAssets"
    doFirst {
        for (String assetName : ['fontkit.js', 'fflate.js']) {
            if (!file("../../.generated/vendor/${assetName}").isFile()) {
                throw new GradleException("Missing local browser asset: ${assetName}. Run npm install and npm run build:vendor in FontViewer first.")
            }
        }
    }
}

tasks.configureEach {
    if (name == 'mergeDebugAssets' || name == 'mergeReleaseAssets') {
        dependsOn tasks.named('stageFontShelfAssets')
    }
}
