<script>
'use strict';
const $=id=>document.getElementById(id);
const records=new Map();
let counter=0,ascending=true,loading=false;
const selectedByFamily=new Map(),collapsedByFamily=new Map(),cardsByFamily=new Map();
const catalog=new Map(),savedLists=new Map();
let activeList='',libraryReady=false;
let glyphObserver;
// Group face names using both naming conventions and archive provenance.
// Avoid generic first-word/first-two-word grouping: e.g. "Super Comic"
// and "Super Hockey" must remain separate families.
const VARIANT_WORDS=new Set([
 'regular','roman','normal','book','thin','hairline','extralight','ultralight',
 'light','medium','semibold','demibold','bold','extrabold','ultrabold','black',
 'heavy','italic','oblique','leftalic','rotalic','semiitalic','superitalic',
 'condensed','semicondensed','extracondensed','compressed','narrow','expanded',
 'extended','wide','3d','sc','smallcaps','caps','outline','outlined','inline',
 'engraved','bevel','chrome','gradient','halftone','punch','rotated','title',
 'shadow','shaded','filled','solid','rough','distressed','textured','display',
 'personaluse','personal','use','demo','trial','small','semi','super'
]);
function compactName(name){
 return String(name||'').normalize('NFKC').toLocaleLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
}
function familyTokens(name){
 const spaced=String(name||'')
  .replace(/([a-z])([A-Z])/g,'$1 $2')
  .replace(/([A-Za-z])([0-9])/g,'$1 $2')
  .replace(/([0-9])([A-Za-z])/g,'$1 $2');
 return spaced.normalize('NFKC').toLocaleLowerCase().match(/[\p{L}\p{N}]+/gu)||[];
}
function normalizedFamilyName(font,file){
 return safeName(font.familyName||font.fullName||file.split('/').pop().replace(/\.[^.]+$/,'')).trim();
}
function familyStem(name){
 const tokens=familyTokens(name);
 // Strip trailing style descriptors without discarding the actual root.
 while(tokens.length>1&&VARIANT_WORDS.has(tokens[tokens.length-1]))tokens.pop();
 let stem=compactName(tokens.join(''));
 // Fonts sometimes attach descriptors directly to their family identifier.
 const suffixes=['personaluse','smallcaps','semicondensed','extracondensed',
  'semibold','extrabold','extralight','ultrabold','ultralight','semiitalic',
  'superitalic','condensed','expanded','extended','engraved','gradient',
  'halftone','outlined','outline','leftalic','rotalic','rotated','shadow',
  'italic','oblique','regular','medium','light','black','heavy','bold',
  'bevel','chrome','punch','thin','demo','trial','title','sc','3d'];
 let changed=true;
 while(changed){
  changed=false;
  for(const suffix of suffixes){
   if(stem.endsWith(suffix)&&stem.length-suffix.length>=5){
    stem=stem.slice(0,-suffix.length);changed=true;break;
   }
  }

}
function sourceStem(rec){
 const src=String(rec.source||'');
 if(!/\.zip$/i.test(src))return '';
 const base=src.split('/').pop().replace(/\.zip$/i,'');
 return familyStem(base.replace(/(?:[-_ ](?:font|fonts|typeface|family|pack|bundle))+(?:[-_ ](?:font|fonts))?$/i,''));
}
function relatedFaces(a,b){
 const stemA=familyStem(a.familyName),stemB=familyStem(b.familyName);
 if(stemA&&stemA===stemB)return true;
 // A package with a genuine shared face-name prefix is strong evidence;
 // merely sharing a ZIP is not (Patrick Hand and Unkempt share a ZIP).
 const sameZip=/\.zip$/i.test(a.source||'')&&a.source===b.source;
 const nameA=compactName(a.familyName),nameB=compactName(b.familyName);
 const shorter=nameA.length<=nameB.length?nameA:nameB;
 if(shorter.length>=5&&(nameA.startsWith(nameB)||nameB.startsWith(nameA))){
  const tail=(nameA.length>nameB.length?nameA:nameB).slice(shorter.length);
  if(!tail||VARIANT_WORDS.has(tail)||familyStem(tail)==='')return true;
 }
 if(sameZip){
  let common=0;
  while(common<Math.min(nameA.length,nameB.length)&&nameA[common]===nameB[common])common++;
  const archive=sourceStem(a);
  if(common>=6&&(archive.length>=5&&nameA.startsWith(archive)&&nameB.startsWith(archive)))return true;
  if(common>=7&&common>=Math.min(nameA.length,nameB.length)*.6)return true;

}
const supported=/\.(ttf|otf|woff2?|ttc|otc)$/i;
let fontkitPromise;
function getFontkit(){return fontkitPromise??=import('./vendor/fontkit.js').then(m=>m.default?.create?m.default:m).catch(e=>{fontkitPromise=null;throw new Error('Bundled font parser unavailable: '+e.message)})}
const MAX_ENTRY=30*1024*1024,MAX_TOTAL=180*1024*1024,MAX_COUNT=250;
const allRange=[
[0x20,0x7e],[0xa0,0x024f],[0x0370,0x052f],[0x0590,0x06ff],[0x0900,0x097f],[0x2000,0x206f],[0x20a0,0x20cf],[0x2100,0x214f],[0x2190,0x21ff],[0x2200,0x22ff],[0x2500,0x257f],[0x2600,0x26ff],[0x2700,0x27bf],[0x3000,0x30ff],[0x4e00,0x4eff]];
const safeName=s=>String(s||'').replace(/[\u0000-\u001f]/g,'').slice(0,250);
function status(s){$('status').textContent=s}
function labelName(font,file){const names=font.names||{};const localized=key=>names[key]?.en||Object.values(names[key]||{})[0]||'';return safeName(localized('fullName')||[localized('fontFamily'),localized('fontSubfamily')].filter(Boolean).join(' ')||file.replace(/\.[^.]+$/,''))}
function glyphMap(font){
 const cps=new Set();
 for(const glyph of font.glyphs.glyphs ? Object.values(font.glyphs.glyphs):[]){
  if(!glyph)continue;
  if(Number.isInteger(glyph.unicode))cps.add(glyph.unicode);
  for(const cp of glyph.unicodes||[])cps.add(cp);
 }
 // cmap is more comprehensive than iterating lazily-loaded glyph records
 for(const key of Object.keys(font.tables?.cmap?.glyphIndexMap||{}))cps.add(Number(key));
 return [...cps].filter(cp=>cp>=32&&cp<=0x10ffff&&!(cp>=0xd800&&cp<=0xdfff)).sort((a,b)=>a-b);
}
function fingerprint(bytes){let h=2166136261;for(let i=0;i<bytes.length;i++){h^=bytes[i];h=Math.imul(h,16777619)}return bytes.length+':'+(h>>>0).toString(16)}

function variantKey(font,file){
 const identity=font.postscriptName||[font.familyName,font.subfamilyName].filter(Boolean).join(' ')||font.fullName||file.split('/').pop().replace(/\.(ttf|otf|woff2?|ttc|otc)$/i,'');
 return String(identity).normalize('NFKC').toLocaleLowerCase().replace(/[\s_-]+/g,'');
}
function formatPriority(file){return ({otf:0,ttf:1,woff2:2,woff:3,otc:4,ttc:5})[file.split('.').pop().toLowerCase()]??9}
function cleanupFont(rec){document.fonts.delete(rec.face);URL.revokeObjectURL(rec.url)}
function extractCollectionFace(bytes,index){
 const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 const invalid=()=>{throw Error('Invalid font collection directory')};
 if(bytes.length<16||view.getUint32(0)!==0x74746366)invalid();
 const count=view.getUint32(8);
 if(count>128||index>=count||12+count*4>bytes.length)invalid();
 const at=view.getUint32(12+index*4);
 if(at+12>bytes.length)invalid();
 const n=view.getUint16(at+4);
 if(n<1||n>256||at+12+16*n>bytes.length)invalid();
 const tables=[];
 for(let i=0;i<n;i++){
  const p=at+12+i*16,off=view.getUint32(p+8),len=view.getUint32(p+12);
  if(off>bytes.length||len>bytes.length-off)invalid();
  tables.push({tag:view.getUint32(p),sum:view.getUint32(p+4),off,len});
 }
 let total=12+n*16;
 for(const t of tables)total+=(t.len+3)&~3;
 if(total>MAX_ENTRY)throw Error('Extracted face exceeds 30 MB');
 const out=new Uint8Array(total),dst=new DataView(out.buffer);
 out.set(bytes.subarray(at,at+4),0);dst.setUint16(4,n);
 const pow=2**Math.floor(Math.log2(n));dst.setUint16(6,pow*16);dst.setUint16(8,Math.log2(pow));dst.setUint16(10,n*16-pow*16);
 let cursor=12+n*16;
 for(let i=0;i<n;i++){
  const t=tables[i],p=12+i*16;
  dst.setUint32(p,t.tag);dst.setUint32(p+4,t.sum);dst.setUint32(p+8,cursor);dst.setUint32(p+12,t.len);
  out.set(bytes.subarray(t.off,t.off+t.len),cursor);cursor+=(t.len+3)&~3;

}
function axesOf(font){
 return Object.entries(font.variationAxes||{}).filter(([tag,a])=>/^[A-Za-z0-9]{4}$/.test(tag)&&Number.isFinite(a.min)&&Number.isFinite(a.max)&&a.max>a.min).map(([tag,a])=>({tag,name:a.name||tag,min:a.min,max:a.max,value:a.default??a.min}));
}
async function addFont(bytes,file,source){
 if(bytes.length>MAX_ENTRY)throw Error('Font exceeds 30 MB');
 const kit=await getFontkit(),collection=kit.create(bytes);
 const faces=Array.isArray(collection.fonts)?collection.fonts:[collection];
 let added=0;
 for(let i=0;i<faces.length;i++){
  const font=faces[i],key=fingerprint(bytes)+':'+(faces.length>1?i:0);
  const saved=[...catalog.values()].find(r=>r.key===key);
  if(saved){
   if(saved.hidden){
    await revive(saved);saved.hidden=false;await FontLibrary.update(saved);added++;
   }
   continue;
  }
  if([...records.values()].some(r=>r.key===key))continue;
  const variant=variantKey(font,file);
  const existing=[...catalog.values()].find(r=>r.variant===variant);
  if(existing&&formatPriority(existing.file)<=formatPriority(file)){
   if(existing.hidden){
    await revive(existing);existing.hidden=false;await FontLibrary.update(existing);added++;
   }
   continue;
  }
  if(!existing&&catalog.size>=MAX_COUNT)throw Error('250 saved-font limit reached');
  const raw=faces.length>1?extractCollectionFace(bytes,i):bytes;
  const id=existing?existing.id:'fs'+(++counter),family='font-'+id,url=URL.createObjectURL(new Blob([raw]));

  try{await face.load();document.fonts.add(face)}catch(e){URL.revokeObjectURL(url);throw Error('Browser cannot load '+(font.fullName||file))}
  const cps=[...new Set(font.characterSet||[])].filter(cp=>cp>=32&&cp<=0x10ffff&&!(cp>=0xd800&&cp<=0xdfff)).sort((a,b)=>a-b);
  const name=safeName(font.fullName||[font.familyName,font.subfamilyName].filter(Boolean).join(' ')||file);
  const familyName=normalizedFamilyName(font,file);
  const rec={id,key,variant,name,familyName,familyKey:familyStem(familyName),styleName:safeName(font.subfamilyName||''),file:safeName(file),source:safeName(source),family,url,face,cps,axes:axesOf(font),hidden:false,tags:existing?.tags||[],familyTags:existing?.familyTags||[]};
  const meta=fontMeta(rec);
  try{await FontLibrary.save(meta,raw)}
  catch(e){cleanupFont(rec);throw Error('Cannot save font persistently: '+e.message)}
  if(existing){const old=records.get(existing.id);if(old)cleanupFont(old);records.delete(existing.id)}
  catalog.set(id,meta);records.set(id,rec);added++;

}
async function processFile(file,stats){
 if(/\.zip$/i.test(file.name)){
  if(!window.fflate)throw Error('Bundled ZIP reader unavailable');
  if(file.size>MAX_TOTAL)throw Error('ZIP exceeds 180 MB');
  const archive=new Uint8Array(await file.arrayBuffer());
  const contents=fflate.unzipSync(archive,{filter:info=>supported.test(info.name)&&info.originalSize<=MAX_ENTRY});
  const candidates=Object.entries(contents).sort(([a],[b])=>formatPriority(a)-formatPriority(b));
  for(const [name,bytes] of candidates){
   if(stats.processed>=MAX_COUNT)throw Error('Import limit reached');
   stats.processed++;
   try{stats.added+=await addFont(bytes,name,file.name)}catch(e){stats.errors.push(name+': '+e.message)}
  }
 }else if(supported.test(file.name)){
  stats.processed++;
  stats.added+=await addFont(new Uint8Array(await file.arrayBuffer()),file.name,file.name);
 }else throw Error('Unsupported file type');
}
async function importFiles(files){
 if(loading)return;loading=true;$('add').disabled=true;

 status('Importing fonts…');
 try{
  for(const file of files){
   size+=file.size;
   if(size>MAX_TOTAL){stats.errors.push('Selection exceeds 180 MB limit');break}
   try{await processFile(file,stats)}catch(e){stats.errors.push(file.name+': '+e.message)}
   render();
  }
 }finally{
  loading=false;$('add').disabled=false;$('file').value='';
  status(stats.added+' added'+(stats.errors.length?', '+stats.errors.length+' errors: '+stats.errors.slice(0,2).join('; '):'')+'.');
  render();
 }
}
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}

function glyphStyle(record){
 return record.axes?.length?record.axes.map(a=>'"'+a.tag+'" '+a.value).join(', '):'normal';
}
function renderGlyphs(box,record){
 const arr=record.cps;

 const token={cancelled:false};box._renderToken=token;

 function frame(){
  if(token.cancelled||!box.isConnected)return;

  const end=Math.min(index+48,chosen.length);
  while(index<end){
   const cp=chosen[index++],cell=make('div','glyph'),symbol=make('b','',String.fromCodePoint(cp));

   if(record.axes?.length)symbol.style.fontVariationSettings=glyphStyle(record);
   cell.append(symbol,make('small','',cp.toString(16).toUpperCase().padStart(4,'0')));
   fragment.append(cell);

function cancelGlyphs(card){

 if(glyphs?._renderToken)glyphs._renderToken.cancelled=true;

}
function groupedRecords(list){
 const parent=list.map((_,i)=>i);

  if(relatedFaces(list[i],list[j]))parent[root(i)]=root(j);

 for(let i=0;i<list.length;i++){
  const k=root(i);
  if(!clusters.has(k))clusters.set(k,[]);
  clusters.get(k).push(list[i]);

  variants.sort((a,b)=>a.name.localeCompare(b.name)||a.file.localeCompare(b.file));

  const key='family:'+stems.sort((a,b)=>a.length-b.length||a.localeCompare(b))[0]||'family:'+variants[0].id;
  groups.set(key,variants);
 }
 return groups;
}
let groupedCacheKey='',groupedCache=null;
function groupsNow(){
 const current=[...records.values()];
 const signature=current.map(rec=>rec.id+':'+rec.variant+':'+rec.familyName).join('|');
 if(groupedCache&&signature===groupedCacheKey)return groupedCache;
 groupedCacheKey=signature;
 return groupedCache=groupedRecords(current);
}
function visibleGroups(){
 const groups=groupsNow();
 const allowed=activeList?savedLists.get(activeList)?.ids||[]:null;
 const filter=$('tagFilter')?.value||'';
 return [...groups.entries()].filter(([key,variants])=>
  (!allowed||variants.some(r=>allowed.includes(r.id)))&&
  (!filter||variants.some(r=>[...(catalog.get(r.id)?.tags||[]),...(catalog.get(r.id)?.familyTags||[])].includes(filter))));
}
function updateCount(){
 const count=cardsByFamily.size;
 $('count').textContent=count+' font '+(count===1?'family':'families')+' displayed';
 $('empty').hidden=count>0;$('clear').disabled=records.size===0;
}
function makeFamilyCard(key,variants){
 const selected=selectedByFamily.get(key);
 const index=Math.max(0,variants.findIndex(r=>r.id===selected));
 const rec=variants[index];selectedByFamily.set(key,rec.id);
 const card=make('article','card'),head=make('div','cardhead'),left=make('div'),controls=make('div','variant-controls');
 const title=make('h2','fontname',rec.name),filename=make('p','filename',rec.file);
 const remove=make('button','remove','x');
 remove.setAttribute('aria-label','Remove entire '+rec.familyName+' family');remove.title='Remove entire font family';
 const styled=[title,filename,remove];
 for(const el of styled)el.style.fontFamily='"'+rec.family+'"';
 left.append(title,filename);
 if(variants.length>1){
  const previous=make('button','variant-arrow','<'),next=make('button','variant-arrow','>');
  previous.setAttribute('aria-label','Previous variant of '+rec.familyName);
  next.setAttribute('aria-label','Next variant of '+rec.familyName);
  for(const el of [previous,next]){el.style.fontFamily='"'+rec.family+'"';styled.push(el)}
  previous.onclick=()=>showVariant(key,variants[(index+variants.length-1)%variants.length].id);
  next.onclick=()=>showVariant(key,variants[(index+1)%variants.length].id);
  controls.append(previous,next);
  left.append(make('span','variant-position',(index+1)+' / '+variants.length));
 }
 remove.onclick=()=>removeFamily(key);
 controls.append(remove);head.append(left,controls);
 const sample=make('div','sample',$('preview').value||' ');sample.style.fontFamily='"'+rec.family+'"';
 const meta=make('div','meta');
 meta.append(make('span','',rec.cps.length.toLocaleString()+' mapped characters'),make('span','',rec.source===rec.file?'Direct import':'ZIP: '+rec.source));
 const axes=make('div','axes');
 if(rec.axes.length){
  axes.append(make('p','label','VARIABLE FONT AXES'));
  const apply=()=>{
   const settings=glyphStyle(rec);
   sample.style.fontVariationSettings=settings;
   for(const el of styled)el.style.fontVariationSettings=settings;
   card.querySelectorAll('.glyph b').forEach(g=>g.style.fontVariationSettings=settings);
  };
  for(const axis of rec.axes){
   const wrapper=make('label','axis'),axisTitle=make('span','',axis.name+' ('+axis.tag+')'),value=make('output','',String(axis.value));
   const slider=make('input');slider.type='range';slider.min=axis.min;slider.max=axis.max;slider.step=Math.max((axis.max-axis.min)/200,0.01);slider.value=axis.value;slider.setAttribute('aria-label',axis.name);
   slider.oninput=()=>{axis.value=Number(slider.value);value.textContent=Number(axis.value.toFixed(2)).toString();apply()};
   wrapper.append(axisTitle,value,slider);axes.append(wrapper);
  }
  apply();
 }
 const details=make('details'),summary=make('summary','','CHARACTER MAP');
 details.open=collapsedByFamily.get(key)===false;
 const glyphs=make('div','glyphs');details.append(summary,glyphs);
 let populated=false;
 function maybePopulate(){if(details.open&&!populated){populated=true;renderGlyphs(glyphs,rec)}}
 details.addEventListener('toggle',()=>{
  collapsedByFamily.set(key,!details.open);
  if(details.open)maybePopulate();
 });
 const tools=make('div','card-tools');
 const tagButton=make('button','','Family tags');tagButton.onclick=()=>editTags(key);
 const faceTagButton=make('button','','Face tags');faceTagButton.onclick=()=>editFaceTags(rec.id);
 const selectedList=savedLists.get(activeList);
 const isInList=selectedList&&variants.some(v=>selectedList.ids.includes(v.id));
 const listButton=make('button','',isInList?'− List':'＋ List');
 listButton.onclick=()=>isInList?removeFamilyFromList(key):addFamilyToList(key);
 tools.append(tagButton,faceTagButton,listButton);
 for(const tag of [...new Set([...(catalog.get(rec.id)?.familyTags||[]),...(catalog.get(rec.id)?.tags||[])])])tools.append(make('span','tag-chip',tag));
 card.append(head,sample,meta,axes,tools,details);
 card._maybePopulate=maybePopulate;
 return card;
}
function observeCard(card){
 if(!glyphObserver&&'IntersectionObserver' in window){
  glyphObserver=new IntersectionObserver(entries=>{
   for(const entry of entries)if(entry.isIntersecting){
    entry.target._maybePopulate?.();
    glyphObserver.unobserve(entry.target);
   }
  },{rootMargin:'180px 0px'});
 }
 if(glyphObserver)glyphObserver.observe(card);
 else card._maybePopulate?.();
}
function showVariant(key,id){
 const old=cardsByFamily.get(key),variants=groupsNow().get(key);
 if(!old||!variants||!variants.some(v=>v.id===id))return;
 selectedByFamily.set(key,id);
 const replacement=makeFamilyCard(key,variants);
 cancelGlyphs(old);old.replaceWith(replacement);
 cardsByFamily.set(key,replacement);observeCard(replacement);
}
function render(){
 const root=$('fonts');
 const grouped=visibleGroups().sort((a,b)=>ascending?a[1][0].familyName.localeCompare(b[1][0].familyName):b[1][0].familyName.localeCompare(a[1][0].familyName));
 for(const card of cardsByFamily.values())cancelGlyphs(card);
 cardsByFamily.clear();
 const fragment=document.createDocumentFragment();
 for(const [key,variants] of grouped){
  const card=makeFamilyCard(key,variants);cardsByFamily.set(key,card);fragment.append(card);
 }
 root.replaceChildren(fragment);updateCount();
 for(const card of cardsByFamily.values())observeCard(card);
}
async function removeFamily(key){
 const family=groupsNow().get(key)||[];
 if(!family.length)return;
 const card=cardsByFamily.get(key);
 cancelGlyphs(card);card?.remove();cardsByFamily.delete(key);
 for(const rec of family){
  const meta=catalog.get(rec.id);if(meta){meta.hidden=true;catalog.set(rec.id,meta)}
  cleanupFont(rec);records.delete(rec.id);
 }
 selectedByFamily.delete(key);collapsedByFamily.delete(key);updateCount();
 renderLibrary();
 status('Hidden '+family[0].familyName+' ('+family.length+' variants). Restore from Library.');
 try{for(const rec of family){const meta=catalog.get(rec.id);if(meta)await FontLibrary.update(meta)}}
 catch(e){status('Could not save hide state: '+e.message)}
}
$('add').onclick=()=>$('file').click();
$('file').onchange=e=>importFiles([...e.target.files]);
$('clear').onclick=async()=>{
 if(!records.size)return;
 const all=[...records.values()];
 for(const card of cardsByFamily.values())cancelGlyphs(card);
 for(const rec of all){cleanupFont(rec);const meta=catalog.get(rec.id);if(meta){meta.hidden=true;catalog.set(rec.id,meta)}}
 records.clear();selectedByFamily.clear();collapsedByFamily.clear();cardsByFamily.clear();
 render();renderLibrary();
 try{for(const rec of all){const meta=catalog.get(rec.id);if(meta)await FontLibrary.update(meta)};status('Shelf hidden. All fonts remain in Library.')}
 catch(e){status('Hide was not fully saved: '+e.message)}
};
$('sort').onclick=()=>{ascending=!ascending;$('sort').textContent='Sort: name '+(ascending?'↑':'↓');render()};
const savedPreview=localStorage.getItem('font-shelf-preview');
if(savedPreview!==null)$('preview').value=savedPreview;
$('preview').addEventListener('input',()=>{
 localStorage.setItem('font-shelf-preview',$('preview').value);
 document.querySelectorAll('.sample').forEach(el=>el.textContent=$('preview').value||' ');
});

function fontMeta(rec){
 return {id:rec.id,key:rec.key,variant:rec.variant,name:rec.name,familyName:rec.familyName,
  familyKey:rec.familyKey,styleName:rec.styleName,file:rec.file,source:rec.source,
  cps:rec.cps,axes:rec.axes,hidden:!!rec.hidden,tags:rec.tags||[],familyTags:rec.familyTags||[]};
}
async function revive(meta){
 const stored=await FontLibrary.get('data',meta.id);
 if(!stored?.bytes)throw Error('Missing saved bytes for '+meta.name);
 const url=URL.createObjectURL(new Blob([stored.bytes]));
 const family='font-'+meta.id,face=new FontFace(family,'url("'+url+'")');
 try{await face.load();document.fonts.add(face)}
 catch(e){URL.revokeObjectURL(url);throw Error('Cannot restore '+meta.name)}
 records.set(meta.id,{...meta,family,url,face,axes:meta.axes||[],cps:meta.cps||[]});
}
async function initLibrary(){
 status('Opening saved font library…');loading=true;$('add').disabled=true;
 try{
  await FontLibrary.open();
  const [fonts,lists]=await Promise.all([FontLibrary.all('fonts'),FontLibrary.all('lists')]);
  for(const meta of fonts){catalog.set(meta.id,meta);counter=Math.max(counter,Number(String(meta.id).replace(/^fs/,''))||0)}
  for(const list of lists)savedLists.set(list.id,list);
  libraryReady=true;updateListPicker();updateTagPicker();renderLibrary();
  const visible=fonts.filter(f=>!f.hidden);let loaded=0,failed=0;
  for(let i=0;i<visible.length;i+=4){
   await Promise.all(visible.slice(i,i+4).map(async meta=>{try{await revive(meta);loaded++}catch(e){failed++}}));
   if((i+4)%12===0){render();status('Restoring '+Math.min(i+4,visible.length)+' / '+visible.length+' saved fonts…');await new Promise(resolve=>requestAnimationFrame(resolve))}
  }
  render();status(loaded+' saved font'+(loaded===1?'':'s')+' restored'+(failed?', '+failed+' could not be loaded':'')+'.');
 }catch(e){status('Persistent library unavailable: '+e.message)}
 finally{loading=false;$('add').disabled=false}
}
function updateListPicker(){
 const picker=$('viewList'),old=activeList;
 picker.replaceChildren(new Option('All visible fonts',''));
 for(const list of savedLists.values())picker.add(new Option(list.title,list.id));
 if(savedLists.has(old))picker.value=old;else{activeList='';picker.value=''}
 $('listMenu').disabled=!activeList;
}
function renderLibrary(){
 const panel=$('libraryPanel');if(panel.hidden)return;
 const root=$('libraryRows');root.replaceChildren();
 const groups=groupedRecords([...catalog.values()]);
 const sorted=[...groups.entries()].sort((a,b)=>a[1][0].familyName.localeCompare(b[1][0].familyName));
 for(const [key,group] of sorted){
  const shown=group.some(r=>!r.hidden),row=make('div','library-row');
  const label=make('span','family-label',group[0].familyName+' ('+group.length+')');
  const toggle=make('button','',shown?'Hide':'Show');
  toggle.onclick=()=>toggleLibraryGroup(group,!shown);
  const tags=make('button','','Tags');tags.onclick=()=>editTags(key,true);
  const del=make('button','danger','Delete');del.setAttribute('aria-label','Permanently delete '+group[0].familyName);
  del.onclick=()=>deleteLibraryGroup(group);
  row.append(label,toggle,tags,del);root.append(row);
 }
 if(!sorted.length)root.append(make('p','library-help','No saved fonts yet. Import some using Add fonts / ZIPs.'));
}
async function toggleLibraryGroup(group,show){
 if(show){
  let count=0;
  for(const item of group){
   const meta=catalog.get(item.id);if(!meta||!meta.hidden)continue;
   try{await revive(meta);meta.hidden=false;await FontLibrary.update(meta);count++}
   catch(e){status('Restore failed: '+e.message)}
  }
  status('Restored '+count+' font variants.');
 }else{
  const activeGroups=groupsNow();
  const ids=new Set(group.map(x=>x.id));
  const targets=[...activeGroups.values()].filter(g=>g.some(x=>ids.has(x.id)));
  for(const g of targets)await removeFamily(groupKeyFor(g));
 }
 render();renderLibrary();
}
function groupKeyFor(group){
 for(const [key,variants] of groupsNow())if(variants.some(v=>group.some(x=>x.id===v.id)))return key;
 return '';
}
async function deleteLibraryGroup(group){
 if(!confirm('Permanently delete '+group[0].familyName+' and its '+group.length+' saved font file(s)?'))return;
 const ids=group.map(f=>f.id),set=new Set(ids);
 try{
  await FontLibrary.remove(ids);
  for(const id of ids){const rec=records.get(id);if(rec){cleanupFont(rec);records.delete(id)}catalog.delete(id)}
  for(const list of savedLists.values()){
   const next=list.ids.filter(id=>!set.has(id));
   if(next.length!==list.ids.length){list.ids=next;await FontLibrary.saveList(list)}
  }
  updateTagPicker();render();renderLibrary();status('Deleted '+group[0].familyName+' permanently.');
 }catch(e){status('Deletion failed: '+e.message)}
}
async function editTags(key,libraryOnly=false){
 const group=(libraryOnly?groupedRecords([...catalog.values()]):groupsNow()).get(key)||[];
 if(!group.length)return;
 const existing=[...new Set(group.flatMap(r=>catalog.get(r.id)?.familyTags||[]))];
 const input=prompt('Tags for '+group[0].familyName+' (comma-separated):',existing.join(', '));
 if(input===null)return;
 const tags=[...new Map(input.split(',').map(x=>x.trim()).filter(Boolean).slice(0,32).map(x=>[x.toLocaleLowerCase(),x])).values()];
 try{
  for(const item of group){const meta=catalog.get(item.id);if(!meta)continue;meta.familyTags=tags;await FontLibrary.update(meta);const rec=records.get(item.id);if(rec)rec.familyTags=tags}
  updateTagPicker();render();renderLibrary();status('Tags saved for '+group[0].familyName);
 }catch(e){status('Could not save tags: '+e.message)}
}

function updateTagPicker(){
 const picker=$('tagFilter'),previous=picker.value;
 const tags=[...new Set([...catalog.values()].flatMap(x=>[...(x.tags||[]),...(x.familyTags||[])]))].sort((a,b)=>a.localeCompare(b));
 picker.replaceChildren(new Option('All tags',''));
 for(const tag of tags)picker.add(new Option(tag,tag));
 picker.value=tags.includes(previous)?previous:'';
}
async function removeFamilyFromList(key){
 const group=groupsNow().get(key)||[],list=savedLists.get(activeList);
 if(!group.length||!list)return;
 const ids=new Set(group.map(x=>x.id));
 const old=[...list.ids];list.ids=list.ids.filter(id=>!ids.has(id));
 try{await FontLibrary.saveList(list);render();status('Removed '+group[0].familyName+' from '+list.title)}
 catch(e){list.ids=old;status('Could not edit list: '+e.message)}
}
async function editFaceTags(id){
 const meta=catalog.get(id);if(!meta)return;
 const input=prompt('Tags for '+meta.name+' (this variant only, comma-separated):',(meta.tags||[]).join(', '));
 if(input===null)return;
 const tags=[...new Map(input.split(',').map(x=>x.trim()).filter(Boolean).slice(0,32).map(x=>[x.toLocaleLowerCase(),x])).values()];
 try{
  meta.tags=tags;await FontLibrary.update(meta);
  const rec=records.get(id);if(rec)rec.tags=tags;
  updateTagPicker();render();renderLibrary();status('Saved face tags for '+meta.name);
 }catch(e){status('Could not save face tags: '+e.message)}
}
async function createList(){
 const title=prompt('Title for the new saved font list:');if(!title?.trim())return null;
 if([...savedLists.values()].some(x=>x.title.toLocaleLowerCase()===title.trim().toLocaleLowerCase())){status('A list with that title already exists.');return null}
 const id='list-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
 const list={id,title:title.trim().slice(0,80),ids:[]};
 try{await FontLibrary.saveList(list);savedLists.set(id,list);updateListPicker();status('Created list '+list.title+'. Use ＋ List on family cards to add fonts.');return list}
 catch(e){status('List creation failed: '+e.message);return null}
}
async function addFamilyToList(key){
 const group=groupsNow().get(key)||[];if(!group.length)return;
 let list=savedLists.get(activeList);
 if(!list){
  if(savedLists.size===1)list=[...savedLists.values()][0];
  else if(savedLists.size>1){
   const choice=prompt('Add to which list? '+[...savedLists.values()].map(x=>x.title).join(' / '));
   if(choice===null)return;
   list=[...savedLists.values()].find(x=>x.title.toLowerCase()===choice.trim().toLowerCase());
   if(!list){status('No list matched that title.');return}
  }else list=await createList();
 }
 if(!list)return;
 const ids=new Set(list.ids);
 for(const rec of group)ids.add(rec.id);
 list.ids=[...ids];
 try{await FontLibrary.saveList(list);status(group[0].familyName+' saved to '+list.title);updateListPicker();render()}
 catch(e){status('Could not save list: '+e.message)}
}
$('libraryToggle').onclick=()=>{
 const p=$('libraryPanel');p.hidden=!p.hidden;
 $('libraryToggle').setAttribute('aria-expanded',String(!p.hidden));renderLibrary();
};
$('viewList').onchange=()=>{activeList=$('viewList').value;updateListPicker();render()};
$('tagFilter').onchange=()=>render();
$('newList').onclick=()=>createList();
$('listMenu').onclick=async()=>{
 const list=savedLists.get(activeList);if(!list)return;
 const response=prompt('Rename this list, or type DELETE to remove it:',list.title);
 if(response===null)return;
 try{
  if(response==='DELETE'){await FontLibrary.removeList(list.id);savedLists.delete(list.id);activeList=''}
  else if(response.trim()){list.title=response.trim().slice(0,80);await FontLibrary.saveList(list)}
  updateListPicker();render();status('Saved lists updated.');
 }catch(e){status('List update failed: '+e.message)}
};
function applyTheme(mode){document.documentElement.dataset.theme=mode;$('theme').textContent=mode==='dark'?'☀ Light':'☾ Dark';$('theme').setAttribute('aria-label','Switch to '+(mode==='dark'?'light':'dark')+' theme');localStorage.setItem('font-shelf-theme',mode)}
applyTheme(localStorage.getItem('font-shelf-theme')==='light'?'light':'dark');
$('theme').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();
initLibrary();
</script>
</body></html>
